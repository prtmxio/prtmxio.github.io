<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pritam | Embedded Systems</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [["$", "$"], ["\\(", "\\)"]],
                    displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                },
                options: {
                    skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
                },
            };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

        <style>
            :root {
                --bg: #080809;
                --bg-alt: #0d0d10;
                --bg-card: #0b0b0e;
                --bg-titlebar: #0f0f13;
                --fg: #d0d0d0;
                --muted: #4a4a4a;
                --muted-2: #7a7a7a;
                --accent: #4af626;
                --accent-dim: rgba(74, 246, 38, 0.07);
                --blue: #5bc0eb;
                --border: #1a1a1f;
                --border-light: #222228;
            }

            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            html { scroll-behavior: smooth; }

            body {
                background: var(--bg);
                color: var(--fg);
                font-family: "Inter", sans-serif;
                line-height: 1.6;
                font-size: 14px;
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
            }

            /* Scanlines overlay */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.018) 0px,
                    rgba(0, 0, 0, 0.018) 1px,
                    transparent 1px,
                    transparent 3px
                );
                pointer-events: none;
                z-index: 9998;
            }

            /* ── Boot overlay ─────────────────────── */
            #boot-overlay {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: opacity 0.45s ease;
            }
            #boot-lines {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                color: var(--muted-2);
                line-height: 2;
                min-width: 320px;
            }
            #boot-lines .b-ok { color: var(--accent); }

            /* ── Layout ───────────────────────────── */
            #main-container {
                max-width: 1120px;
                margin: 0 auto;
                padding: 40px 40px;
                display: grid;
                grid-template-columns: 5fr 7fr;
                gap: 48px;
                align-items: start;
                opacity: 0;
                transition: opacity 0.4s ease;
            }

            /* ── Terminal window (left pane) ─────── */
            .left-pane { position: sticky; top: 40px; }

            .terminal-window {
                border: 1px solid var(--border-light);
                background: var(--bg-alt);
                overflow: hidden;
            }

            .terminal-titlebar {
                background: var(--bg-titlebar);
                padding: 9px 14px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid var(--border);
                user-select: none;
            }
            .t-dots { display: flex; gap: 6px; align-items: center; }
            .t-dot {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                cursor: default;
            }
            .t-dot-r { background: #ff5f57; }
            .t-dot-y { background: #febc2e; }
            .t-dot-g { background: #28c840; }

            .t-hostname {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted-2);
                margin: 0 auto;
                letter-spacing: 0.03em;
            }

            .terminal-body {
                padding: 20px 18px 16px;
            }

            /* Profile pic */
            #profile-pic {
                width: 96px;
                height: 96px;
                border-radius: 3px;
                border: 1px solid var(--border-light);
                object-fit: cover;
                display: block;
                margin-bottom: 18px;
                transition: border-color 0.2s;
            }
            #profile-pic:hover { border-color: var(--accent); }

            /* Prompt rows */
            .p-row {
                display: flex;
                align-items: baseline;
                gap: 7px;
                margin-top: 14px;
                margin-bottom: 3px;
            }
            .p-row:first-of-type { margin-top: 0; }
            .p-dollar {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                font-weight: 700;
                color: var(--accent);
                flex-shrink: 0;
            }
            .p-cmd {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted-2);
            }

            /* Terminal outputs */
            #name {
                font-family: "JetBrains Mono", monospace;
                font-size: 24px;
                font-weight: 700;
                color: var(--fg);
                padding-left: 2px;
                line-height: 1.2;
                margin-bottom: 1px;
            }

            #tagline {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--accent);
                padding-left: 2px;
                letter-spacing: 0.03em;
            }
            .t-cursor::after {
                content: "_";
                animation: blink 1s step-end infinite;
            }

            #bio {
                font-size: 12px;
                color: var(--muted-2);
                padding-left: 2px;
                line-height: 1.75;
                max-width: 280px;
            }

            /* Nav */
            .nav-links { list-style: none; padding-left: 2px; }
            .nav-links li { margin-bottom: 3px; }
            .nav-links a {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                text-decoration: none;
                color: var(--muted-2);
                display: inline-flex;
                align-items: center;
                gap: 5px;
                cursor: pointer;
                transition: color 0.15s;
                letter-spacing: 0.08em;
                user-select: none;
            }
            .nav-links a::before {
                content: ">";
                color: var(--accent);
                font-weight: 700;
                opacity: 0;
                transition: opacity 0.15s;
            }
            .nav-links a:hover,
            .nav-links a.active { color: var(--fg); }
            .nav-links a:hover::before,
            .nav-links a.active::before { opacity: 1; }

            /* Terminal statusbar */
            .terminal-statusbar {
                border-top: 1px solid var(--border);
                background: var(--bg-titlebar);
                padding: 10px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .t-status-left {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .t-status-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 6px var(--accent);
                animation: pulse 2.5s ease-in-out infinite;
            }
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.4; }
            }
            .t-status-text {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 0.05em;
            }

            .resume-button {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted-2);
                text-decoration: none;
                border: 1px solid var(--border-light);
                padding: 3px 9px;
                letter-spacing: 0.06em;
                transition: border-color 0.2s, color 0.2s;
            }
            .resume-button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .social-links {
                list-style: none;
                display: flex;
                gap: 12px;
            }
            .social-links a {
                color: var(--muted);
                text-decoration: none;
                transition: color 0.2s;
                display: block;
            }
            .social-links a:hover { color: var(--fg); }
            .social-links svg { width: 15px; height: 15px; fill: currentColor; display: block; }

            /* ── Right pane ───────────────────────── */
            .right-pane { padding-top: 4px; }

            .content-section {
                display: none;
                animation: fadeIn 0.25s ease;
            }
            .content-section.active { display: block; }

            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
            @keyframes blink { 50% { opacity: 0; } }
            @keyframes slideIn {
                from { opacity: 0; transform: translateX(-10px); }
                to   { opacity: 1; transform: translateX(0); }
            }

            /* Command headings */
            .cmd-line {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-bottom: 16px;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--border);
            }
            .cmd-dollar {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                font-weight: 700;
                color: var(--accent);
            }
            .cmd-text {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted-2);
                letter-spacing: 0.04em;
            }
            .cmd-line + .cmd-line { margin-top: 28px; }

            /* About text */
            .about-text {
                color: var(--muted-2);
                font-size: 13px;
                line-height: 1.85;
                margin-bottom: 28px;
            }
            .about-text p + p { margin-top: 0.9rem; }

            /* Separator between about and experience */
            .section-gap { margin-top: 32px; }

            /* Cards */
            .item-card {
                padding: 16px 18px;
                margin-bottom: 10px;
                border: 1px solid var(--border);
                border-left: 2px solid transparent;
                background: var(--bg);
                transition: border-color 0.2s, border-left-color 0.2s, background 0.2s;
                animation: slideIn 0.3s ease both;
            }
            .item-card:hover {
                border-color: var(--border-light);
                border-left-color: var(--accent);
                background: var(--bg-card);
            }

            .card-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 8px;
            }
            .card-idx {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                color: var(--accent);
                letter-spacing: 0.06em;
                opacity: 0.7;
            }
            .card-date {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .item-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--fg);
                margin-bottom: 3px;
            }
            .item-subtitle {
                font-size: 11px;
                color: var(--muted-2);
                margin-bottom: 10px;
            }

            .item-title-link {
                font-size: 13px;
                font-weight: 600;
                color: var(--fg);
                text-decoration: none;
                display: inline-block;
                margin-bottom: 8px;
                cursor: pointer;
                transition: color 0.15s;
            }
            .item-title-link:hover { color: var(--accent); }
            .item-title-link::after {
                content: " \2197";
                font-size: 0.72em;
                opacity: 0.35;
            }
            .item-title-link:hover::after { opacity: 1; }

            .item-description,
            .item-summary {
                color: var(--muted-2);
                font-size: 12px;
                line-height: 1.75;
                margin-bottom: 10px;
            }
            .item-description ul { list-style: none; padding: 0; }
            .item-description ul li {
                font-size: 12px;
                color: var(--muted-2);
                padding-left: 13px;
                position: relative;
                margin-bottom: 4px;
                line-height: 1.65;
            }
            .item-description ul li::before {
                content: "-";
                position: absolute;
                left: 0;
                color: var(--accent);
            }

            /* Tech tags */
            .tech-tags { display: flex; flex-wrap: wrap; gap: 4px; }
            .tech-tag {
                border: 1px solid var(--border-light);
                color: var(--muted);
                padding: 1px 6px;
                font-size: 9px;
                font-family: "JetBrains Mono", monospace;
                letter-spacing: 0.05em;
                transition: border-color 0.15s, color 0.15s;
            }
            .item-card:hover .tech-tag {
                border-color: rgba(74, 246, 38, 0.2);
                color: var(--muted-2);
            }
            .tech-tag.blog-tag {
                border-color: rgba(91, 192, 235, 0.2);
                color: rgba(91, 192, 235, 0.6);
            }

            /* ── Blog viewer ──────────────────────── */
            #blog-post-viewer {
                display: none;
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 100;
                overflow-y: auto;
                animation: fadeIn 0.25s ease;
            }
            .blog-post-container {
                max-width: 700px;
                margin: 0 auto;
                padding: 60px 40px 80px;
            }

            .blog-back-button {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--accent);
                text-decoration: none;
                letter-spacing: 0.08em;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 40px;
                opacity: 0.8;
                transition: opacity 0.2s;
            }
            .blog-back-button:hover { opacity: 1; }

            .blog-post-content .post-title {
                font-family: "JetBrains Mono", monospace;
                font-size: 22px;
                font-weight: 700;
                color: var(--fg);
                margin-bottom: 8px;
                line-height: 1.3;
            }
            .blog-post-content .post-date {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                margin-bottom: 40px;
            }
            .blog-post-content .post-body {
                color: var(--fg);
                font-size: 15px;
                line-height: 1.8;
            }
            .blog-post-content .post-body h1,
            .blog-post-content .post-body h2,
            .blog-post-content .post-body h3 {
                font-family: "JetBrains Mono", monospace;
                color: var(--fg);
                margin-top: 2.5rem;
                margin-bottom: 0.75rem;
            }
            .blog-post-content .post-body h2 { font-size: 17px; }
            .blog-post-content .post-body h3 { font-size: 14px; color: var(--muted-2); }
            .blog-post-content .post-body p { margin-bottom: 1.15rem; }
            .blog-post-content .post-body a { color: var(--accent); text-decoration: underline; }
            .blog-post-content .post-body pre {
                background: var(--bg-alt);
                border: 1px solid var(--border-light);
                padding: 14px 16px;
                overflow-x: auto;
                margin-bottom: 1.15rem;
            }
            .blog-post-content .post-body pre code {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                background: none;
                padding: 0;
                color: inherit;
            }
            .blog-post-content .post-body p > code,
            .blog-post-content .post-body li > code {
                font-family: "JetBrains Mono", monospace;
                background: var(--bg-alt);
                color: var(--accent);
                padding: 1px 5px;
                font-size: 0.88em;
            }
            .blog-post-content .post-body ul,
            .blog-post-content .post-body ol {
                padding-left: 20px;
                margin-bottom: 1.15rem;
            }
            .blog-post-content .post-body li { margin-bottom: 5px; }
            .blog-post-content .post-body blockquote {
                border-left: 2px solid var(--accent);
                padding-left: 16px;
                color: var(--muted-2);
                margin: 1rem 0;
            }

            /* ── Responsive ───────────────────────── */
            @media (max-width: 992px) {
                #main-container {
                    display: block;
                    padding: 24px;
                }
                .left-pane {
                    position: relative;
                    top: 0;
                    margin-bottom: 28px;
                }
            }
            @media (max-width: 768px) {
                #main-container { padding: 16px; }
                #profile-pic { width: 72px; height: 72px; }
                #name { font-size: 20px; }
                .blog-post-container { padding: 40px 20px 60px; }
                .blog-post-content .post-title { font-size: 18px; }
                .blog-post-content .post-body { font-size: 14px; }
            }
        </style>
    </head>
    <body>

        <!-- Boot overlay -->
        <div id="boot-overlay">
            <div id="boot-lines"></div>
        </div>

        <!-- Main layout -->
        <div id="main-container">

            <!-- Left: terminal window -->
            <header class="left-pane">
                <div class="terminal-window">
                    <div class="terminal-titlebar">
                        <div class="t-dots">
                            <span class="t-dot t-dot-r"></span>
                            <span class="t-dot t-dot-y"></span>
                            <span class="t-dot t-dot-g"></span>
                        </div>
                        <span class="t-hostname">pritam@portfolio: ~</span>
                    </div>

                    <div class="terminal-body">
                        <img
                            id="profile-pic"
                            src="res/prof.jpeg"
                            alt="Pritam"
                            onerror="this.src='https://placehold.co/96x96/0d0d10/d0d0d0?text=P'"
                        />

                        <div class="p-row">
                            <span class="p-dollar">$</span>
                            <span class="p-cmd">whoami</span>
                        </div>
                        <h1 id="name"></h1>

                        <div class="p-row">
                            <span class="p-dollar">$</span>
                            <span class="p-cmd">./role.sh</span>
                        </div>
                        <div id="tagline">
                            <span id="tagline-text"></span><span class="t-cursor"></span>
                        </div>

                        <div class="p-row">
                            <span class="p-dollar">$</span>
                            <span class="p-cmd">cat bio.txt</span>
                        </div>
                        <p id="bio"></p>

                        <div class="p-row">
                            <span class="p-dollar">$</span>
                            <span class="p-cmd">ls pages/</span>
                        </div>
                        <nav>
                            <ul class="nav-links">
                                <li><a data-section="about" class="nav-link active">about</a></li>
                                <li><a data-section="projects" class="nav-link">projects</a></li>
                                <li><a data-section="blog" class="nav-link">blog</a></li>
                            </ul>
                        </nav>
                    </div>

                    <div class="terminal-statusbar">
                        <div class="t-status-left">
                            <span class="t-status-dot"></span>
                            <span class="t-status-text">online</span>
                        </div>
                        <a href="res/pritam_resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-button">resume.pdf</a>
                        <ul class="social-links" id="social-links"></ul>
                    </div>
                </div>
            </header>

            <!-- Right: content output -->
            <main class="right-pane">
                <section id="about" class="content-section active">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">cat about.md</span>
                    </div>
                    <div id="about-content" class="about-text"></div>

                    <div class="cmd-line section-gap">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">cat experience.log</span>
                    </div>
                    <div id="experience-container"></div>
                </section>

                <section id="projects" class="content-section">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">ls projects/ --detail</span>
                    </div>
                    <div id="projects-container"></div>
                </section>

                <section id="blog" class="content-section">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">ls blog/ --sort=date</span>
                    </div>
                    <div id="blog-container"></div>
                </section>
            </main>
        </div>

        <!-- Blog viewer -->
        <div id="blog-post-viewer">
            <div class="blog-post-container">
                <a href="#" class="blog-back-button" onclick="hideBlogPost(event)">&larr; cd ..</a>
                <div class="blog-post-content">
                    <h1 id="post-title" class="post-title"></h1>
                    <div id="post-date" class="post-date"></div>
                    <div id="post-body" class="post-body"></div>
                </div>
            </div>
        </div>

        <script>
            let allBlogPosts = [];
            let pendingTagline = null;

            const markdownConverter = new showdown.Converter();
            markdownConverter.setOption("ghCompatibleHeaderId", true);
            markdownConverter.setOption("simpleLineBreaks", true);

            // ── Boot sequence ──────────────────────
            async function boot() {
                const container = document.getElementById("boot-lines");
                const lines = [
                    `<span class="b-ok">></span> loading prtmxio.github.io...`,
                    `<span class="b-ok">></span> reading profile data...<span class="b-ok"> [OK]</span>`,
                    `<span class="b-ok">></span> mounting filesystem...<span class="b-ok"> [OK]</span>`,
                ];
                for (const line of lines) {
                    await delay(260);
                    const el = document.createElement("div");
                    el.innerHTML = line;
                    container.appendChild(el);
                }
                await delay(380);
                const overlay = document.getElementById("boot-overlay");
                overlay.style.opacity = "0";
                await delay(460);
                overlay.style.display = "none";
                document.getElementById("main-container").style.opacity = "1";
                if (pendingTagline !== null) {
                    setTimeout(() => typeWriter("tagline-text", pendingTagline, 36), 80);
                }
            }

            function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

            // ── Typewriter ─────────────────────────
            function typeWriter(elId, text, speed) {
                const el = document.getElementById(elId);
                if (!el) return;
                el.textContent = "";
                let i = 0;
                const t = setInterval(() => {
                    if (i < text.length) { el.textContent += text[i++]; }
                    else { clearInterval(t); }
                }, speed);
            }

            // ── Init ───────────────────────────────
            document.addEventListener("DOMContentLoaded", () => {
                boot();
                loadData();
                setupNavigation();
            });

            // ── Data loading ───────────────────────
            async function loadData() {
                try {
                    const [bioRes, projRes, blogRes] = await Promise.all([
                        fetch("./res/bio.json"),
                        fetch("./res/projects.json"),
                        fetch("./res/blog.json"),
                    ]);
                    if (!bioRes.ok)  throw new Error(`bio.json: ${bioRes.statusText}`);
                    if (!projRes.ok) throw new Error(`projects.json: ${projRes.statusText}`);
                    if (!blogRes.ok) throw new Error(`blog.json: ${blogRes.statusText}`);

                    const [bioData, projectsData, blogRaw] = await Promise.all([
                        bioRes.json(), projRes.json(), blogRes.json(),
                    ]);

                    const blogBaseUrl = blogRes.url;
                    const blogPosts = (blogRaw.posts || []).map((p) => {
                        try { return { ...p, read_me: new URL(p.read_me, blogBaseUrl).href }; }
                        catch { return p; }
                    });

                    renderPage(bioData, projectsData.projects || [], blogPosts);
                } catch (err) {
                    console.error("Error loading data:", err);
                    document.getElementById("main-container").innerHTML = `
                        <div style="padding:80px 40px;font-family:'JetBrains Mono',monospace;font-size:12px;">
                            <p style="color:var(--accent);margin-bottom:8px;">// error</p>
                            <p style="color:var(--muted-2);">${err.message}</p>
                        </div>`;
                }
            }

            // ── Navigation ─────────────────────────
            function setupNavigation() {
                const navLinks = document.querySelectorAll(".nav-link");
                const sections = document.querySelectorAll(".content-section");
                navLinks.forEach((link) => {
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        navLinks.forEach((l) => l.classList.remove("active"));
                        sections.forEach((s) => s.classList.remove("active"));
                        link.classList.add("active");
                        document.getElementById(link.dataset.section).classList.add("active");
                        if (window.innerWidth <= 992) {
                            document.querySelector(".right-pane").scrollIntoView({ behavior: "smooth" });
                        }
                    });
                });
            }

            // ── Render ─────────────────────────────
            function renderPage(bio, projects, blogPosts) {
                document.title = `${bio.profile?.name || "Portfolio"} | Portfolio`;
                document.getElementById("name").textContent = bio.profile?.name || "";
                document.getElementById("bio").textContent = bio.profile?.shortBio || "";

                // Store tagline for boot callback
                pendingTagline = bio.profile?.tagline || "";

                allBlogPosts = blogPosts;
                populateSocials(bio.social);
                renderAboutAndExperience(bio.about?.fullBio || "", bio.experience || []);
                renderProjects(projects);
                renderBlog(blogPosts);
            }

            function renderAboutAndExperience(aboutText, experience) {
                const aboutEl = document.getElementById("about-content");
                aboutEl.textContent = "";
                (aboutText || "").split("\n").forEach((para) => {
                    if (para.trim()) {
                        const p = document.createElement("p");
                        p.textContent = para;
                        aboutEl.appendChild(p);
                    }
                });

                document.getElementById("experience-container").innerHTML = (experience || [])
                    .map((exp, i) => `
                        <div class="item-card" style="animation-delay:${i * 0.07}s">
                            <div class="card-top">
                                <span class="card-idx">[${pad(i + 1)}]</span>
                                <span class="card-date">${exp.date}</span>
                            </div>
                            <h3 class="item-title">${exp.title}</h3>
                            <p class="item-subtitle">${exp.company}</p>
                            <div class="item-description">
                                <ul>${(exp.description || []).map((d) => `<li>${d}</li>`).join("")}</ul>
                            </div>
                        </div>`)
                    .join("");
            }

            function renderProjects(projects) {
                document.getElementById("projects-container").innerHTML = (projects || [])
                    .sort((a, b) => (a.priority || 99) - (b.priority || 99))
                    .map((proj, i) => {
                        const title = proj.codeUrl
                            ? `<a href="${proj.codeUrl}" target="_blank" rel="noopener noreferrer" class="item-title-link">${proj.title}</a>`
                            : `<h3 class="item-title" style="margin-bottom:8px;">${proj.title}</h3>`;
                        return `
                            <div class="item-card" style="animation-delay:${i * 0.07}s">
                                <div class="card-top">
                                    <span class="card-idx">[${pad(i + 1)}]</span>
                                </div>
                                ${title}
                                <p class="item-description">${proj.description || ""}</p>
                                <div class="tech-tags">
                                    ${(proj.technologies || []).map((t) => `<span class="tech-tag">${t}</span>`).join("")}
                                </div>
                            </div>`;
                    })
                    .join("");
            }

            function renderBlog(posts) {
                document.getElementById("blog-container").innerHTML = (posts || [])
                    .map((post, i) => `
                        <div class="item-card" style="animation-delay:${i * 0.07}s">
                            <div class="card-top">
                                <span class="card-idx">[${pad(i + 1)}]</span>
                                <span class="card-date">${post.date || ""}</span>
                            </div>
                            <h3 class="item-title-link" style="cursor:pointer;" onclick="showBlogPost(${i})">${post.title}</h3>
                            <p class="item-summary">${post.content || ""}</p>
                            <div class="tech-tags">
                                ${(post.tags || []).map((t) => `<span class="tech-tag blog-tag">${t}</span>`).join("")}
                            </div>
                        </div>`)
                    .join("");
            }

            function pad(n) { return String(n).padStart(2, "0"); }

            // ── Blog post viewer ───────────────────
            async function showBlogPost(index) {
                const post = allBlogPosts[index];
                if (!post) return;

                document.getElementById("post-title").textContent = post.title || "";
                document.getElementById("post-date").textContent = post.date || "";
                document.getElementById("blog-post-viewer").style.display = "block";
                document.getElementById("main-container").style.display = "none";
                window.scrollTo(0, 0);

                const postBody = document.getElementById("post-body");
                postBody.innerHTML = `<p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted-2);"><span style="color:var(--accent)">></span> loading...</p>`;

                try {
                    const res = await fetch(post.read_me);
                    if (!res.ok) throw new Error(`${post.read_me} (${res.status})`);
                    let md = await res.text();

                    const mathBlocks = [];
                    let mi = 0;
                    function pushMath(tex, display) {
                        const key = `MATH_${mi++}`;
                        mathBlocks.push({ key, tex, display });
                        return `<!--${key}-->`;
                    }

                    md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => pushMath(`$$${tex}$$`, true));
                    md = md.replace(/(?<!\$)\$([^\n$]+?)\$(?!\$)/g, (_, tex) => pushMath(`$${tex}$`, false));

                    let html = markdownConverter.makeHtml(md);
                    mathBlocks.forEach(({ key, tex, display }) => {
                        const re = new RegExp(`<!--${key}-->`, "g");
                        html = html.replace(re, display ? `\n\n${tex}\n\n` : tex);
                    });
                    html = html.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
                    postBody.innerHTML = html;

                    if (window.MathJax?.typesetPromise) {
                        await MathJax.typesetPromise([postBody]);
                    } else {
                        setTimeout(() => window.MathJax?.typesetPromise?.([postBody])?.catch(console.error), 200);
                    }
                } catch (err) {
                    console.error("Blog load error:", err);
                    postBody.innerHTML = `<p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted-2);">// error: ${err.message}</p>`;
                }
            }

            function hideBlogPost(event) {
                event.preventDefault();
                document.getElementById("blog-post-viewer").style.display = "none";
                document.getElementById("main-container").style.display = "";
                document.getElementById("post-title").textContent = "";
                document.getElementById("post-date").textContent = "";
                document.getElementById("post-body").innerHTML = "";
            }

                const icons = {
                    github: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>GitHub</title><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
                    linkedin: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>LinkedIn</title><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.771v20.541C0 23.228.792 24 1.771 24h20.451C23.2 24 24 23.228 24 22.272V1.771C24 .774 23.2 0 22.222 0z"/></svg>`,
                    twitter: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Twitter</title><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.223.085c.645 1.956 2.52 3.379 4.734 3.419-1.77 1.377-3.987 2.199-6.396 2.199-.415 0-.825-.023-1.229-.074a13.935 13.935 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>`,
                    email: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Email</title><path d="M24 4.5v15c0 .825-.675 1.5-1.5 1.5H1.5C.675 21 0 20.325 0 19.5v-15c0-.414.168-.79.44-1.06C.71 3.17 1.096 3 1.5 3H22.5c.404 0 .79.17 1.06.44.272.27.44.646.44 1.06zM3.937 4.5L12 11.82 20.063 4.5H3.937zM2.25 18h19.5V6.345l-9.458 6.54c-.195.135-.435.21-.692.21s-.497-.075-.692-.21L2.25 6.345V18z"/></svg>`,
                };

                document.getElementById("social-links").innerHTML = Object.entries(socials || {})
                    .filter(([, url]) => url)
                    .map(([platform, url]) => `
                        <li>
                            <a href="${platform === "email" ? "mailto:" + url : url}"
                               target="${platform === "email" ? "_self" : "_blank"}"
                               rel="noopener noreferrer"
                               aria-label="${platform}">
                                ${icons[platform] || platform}
                            </a>
                        </li>`)
                    .join("");
            }
        </script>
    </body>
</html>
