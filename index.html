<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pritam | Embedded Systems</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />

        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [["$", "$"], ["\\(", "\\)"]],
                    displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                },
                options: {
                    skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
                },
            };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
        <script type="module" src="js/main.js"></script>
    </head>
    <body>

        <!-- Boot overlay -->
        <div id="boot-overlay">
            <div id="boot-lines"></div>
        </div>

        <div id="main-container">

            <!-- Left: terminal panel -->
            <header class="left-pane">

                <div class="terminal-titlebar">
                    <div class="t-dots">
                        <span class="t-dot t-dot-r"></span>
                        <span class="t-dot t-dot-y"></span>
                        <span class="t-dot t-dot-g"></span>
                    </div>
                    <span class="t-hostname">pritam@portfolio: ~</span>
                </div>

                <div class="terminal-body">
                    <img
                        id="profile-pic"
                        src="res/prof.jpeg"
                        alt="Pritam"
                        onerror="this.src='https://placehold.co/88x88/0e0e12/e4e4e4?text=P'"
                    />

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">whoami</span>
                    </div>
                    <h1 id="name"></h1>

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">./role.sh</span>
                    </div>
                    <div id="tagline">
                        <span id="tagline-text"></span><span class="t-cursor"></span>
                    </div>

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">cat bio.txt</span>
                    </div>
                    <p id="bio"></p>

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">ls pages/</span>
                    </div>
                    <nav>
                        <ul class="nav-links">
                            <li><a data-section="about"    class="nav-link active">about</a></li>
                            <li><a data-section="projects" class="nav-link">projects</a></li>
                            <li><a data-section="blog"     class="nav-link">blog</a></li>
                        </ul>
                    </nav>
                </div>

                <!-- Social links -->
                <div class="terminal-socials">
                    <p class="socials-label">// connect</p>
                    <ul class="social-links" id="social-links"></ul>
                </div>

                <!-- Status bar with resume -->
                <div class="terminal-statusbar">
                    <div class="t-status">
                        <span class="t-status-dot"></span>
                        <span class="t-status-text">online</span>
                    </div>
                    <a href="res/pritam_resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-button">
                        resume.pdf &nearr;
                    </a>
                </div>

            </header>

            <!-- Right: scrollable content -->
            <main class="right-pane">
                <section id="about" class="content-section active">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">cat about.md</span>
                    </div>
                    <div id="about-content" class="about-text"></div>

                    <div class="cmd-line section-gap">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">cat experience.log</span>
                    </div>
                    <div id="experience-container"></div>
                </section>

                <section id="projects" class="content-section">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">ls projects/ --detail</span>
                    </div>
                    <div id="projects-container"></div>
                </section>

                <section id="blog" class="content-section">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">ls blog/ --sort=date</span>
                    </div>
                    <div id="blog-container"></div>
                </section>
            </main>
        </div>

        <!-- Blog post viewer -->
        <div id="blog-post-viewer">
            <div class="blog-post-container">
                <a href="#" class="blog-back-button">&larr; cd ..</a>
                <div class="blog-post-content">
                    <h1 id="post-title" class="post-title"></h1>
                    <div id="post-date" class="post-date"></div>
                    <div id="post-body" class="post-body"></div>
                </div>
            </div>
        </div>

    </body>
</html>
