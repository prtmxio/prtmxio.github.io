<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pritam | Embedded Systems Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* GRUVBOX DARKER THEME */
        :root {
            --bg: #1d2021;
            --bg-alt: #282828;
            --fg: #ebdbb2;
            --gray: #928374;
            --aqua: #689d6a;
            --blue: #458588;
            --green: #98971a;
            --red: #cc241d;
            --yellow: #d79921;
            --card-bg: #32302f;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            font-size: 16px;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(104, 157, 106, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(69, 133, 136, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        /* LEFT PANE (HEADER) */
        .left-pane {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 96px 0;
        }

        #profile-pic {
            width: 220px;
            height: 220px;
            border-radius: 25px;
            margin-bottom: 24px;
            border: 5px solid var(--bg-alt);
            object-fit: cover;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        #profile-pic:hover {
            transform: scale(1.05);
            border-color: var(--aqua);
        }

        .header-content h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 48px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 16px;
        }

        .header-content h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 500;
            color: var(--aqua);
            margin-bottom: 24px;
        }

        .tagline-cursor::after {
            content: '▋';
            margin-left: 8px;
            opacity: 1;
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .header-content p {
            color: var(--gray);
            max-width: 400px;
        }

        .nav-links {
            list-style: none;
            margin-top: 48px;
        }

        .nav-links li {
            margin-bottom: 16px;
        }

        .nav-links a {
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            color: var(--gray);
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .nav-links a .nav-indicator {
            width: 30px;
            height: 1px;
            background-color: var(--gray);
            transition: all 0.2s ease-in-out;
        }
        
        .nav-text {
            display: inline-block;
            width: 100px; /* Ensures all text labels align perfectly */
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--fg);
        }
        
        /* CORRECTED RULE for the indicator bar */
        .nav-links a:hover .nav-indicator,
        .nav-links a.active .nav-indicator {
            width: 60px;
            background-color: var(--fg);
        }

        .resume-container {
            margin-top: 48px;
        }

        .resume-button {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid var(--gray);
            border-radius: 4px;
            color: var(--gray);
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.1em;
            transition: all 0.2s ease-in-out;
        }

        .resume-button:hover {
            background-color: var(--aqua);
            border-color: var(--aqua);
            color: var(--bg);
        }

        .social-links {
            list-style: none;
            display: flex;
            gap: 24px;
            margin-top: auto; 
            padding-top: 48px;
        }
        
        .social-links a {
            color: var(--gray);
            text-decoration: none;
            transition: color 0.2s ease-in-out, transform 0.2s ease-in-out;
        }

        .social-links a:hover {
            color: var(--fg);
            transform: translateY(-2px);
        }

        .social-links svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* RIGHT PANE (CONTENT) */
        .right-pane {
            padding: 96px 0;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .content-section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .about-text {
            color: var(--gray);
            margin-bottom: 4rem;
        }

        .section-heading {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
        }
        
        .item-card {
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            background-color: transparent;
            border: 1px solid var(--bg-alt);
            transition: all 0.3s ease-in-out;
        }
        
        .item-card:hover {
            background-color: var(--card-bg);
            border-color: var(--aqua);
            transform: translateY(-5px);
        }
        
        .item-card .item-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            margin-bottom: 8px;
        }

        .item-date {
            font-size: 13px;
            color: var(--gray);
            text-transform: uppercase;
            padding-top: 4px;
        }
        
        .item-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 4px;
        }
        
        .item-subtitle {
            font-size: 16px;
            color: var(--gray);
        }

        .item-description {
            color: var(--gray);
            margin-bottom: 16px;
        }

        .item-description ul {
            list-style-position: inside;
            padding-left: 5px;
        }

        .item-description ul li {
            margin-bottom: 8px;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech-tag {
            background-color: var(--aqua);
            color: var(--bg);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
        }

        .item-links {
             margin-top: 16px;
        }

        .item-links a {
            color: var(--gray);
            text-decoration: none;
            margin-right: 16px;
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }
        
        .item-links a:hover {
            color: var(--fg);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 1024px) {
            .container {
                display: block;
                padding: 0 20px;
            }

            .left-pane {
                position: relative;
                height: auto;
                padding: 48px 0;
            }

            .left-pane-bottom {
                display: flex;
                flex-direction: column;
            }
            
            .right-pane {
                padding: 0 0 48px 0;
            }
        }
        
        @media (max-width: 768px) {
            .item-card .item-header {
                grid-template-columns: 1fr;
            }
            .item-date {
                margin-bottom: 8px;
            }
            #profile-pic {
                width: 100px;
                height: 100px;
            }
            .header-content h1 {
                font-size: 36px;
            }
        }

    </style>
</head>
<body>

    <div class="container">
        <header class="left-pane">
            <div class="header-content">
                <img id="profile-pic" src="res/profile.jpeg" alt="Profile Picture">
                <h1 id="name"></h1>
                <h2 id="tagline"><span id="tagline-text"></span><span class="tagline-cursor"></span></h2>
                <p id="bio"></p>
                <nav>
                    <ul class="nav-links">
                        <li><a data-section="about" class="nav-link active"><span class="nav-indicator"></span><span class="nav-text">About</span></a></li>
                        <li><a data-section="projects" class="nav-link"><span class="nav-indicator"></span><span class="nav-text">Projects</span></a></li>
                        <li><a data-section="blog" class="nav-link"><span class="nav-indicator"></span><span class="nav-text">Blog</span></a></li>
                    </ul>
                </nav>
            </div>
            
            <div class="left-pane-bottom">
                <div class="resume-container">
                    <a href="res/resume.pdf" target="_blank" class="resume-button">
                        Download Resume
                    </a>
                </div>
                <ul class="social-links" id="social-links"></ul>
            </div>
        </header>

        <main class="right-pane">
            <section id="about" class="content-section active">
                <div id="about-content" class="about-text"></div>
                <div class="section-heading">Experience</div>
                <div id="experience-container"></div>
            </section>

            <section id="projects" class="content-section">
                <div id="projects-container"></div>
            </section>
            
            <section id="blog" class="content-section">
                <div id="blog-container"></div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            setupNavigation();
        });

        async function loadData() {
            try {
                const [bioResponse, projectsResponse, blogResponse] = await Promise.all([
                    fetch('./res/bio.json'),
                    fetch('./res/projects.json'),
                    fetch('./res/blog.json')
                ]);

                if (!bioResponse.ok || !projectsResponse.ok || !blogResponse.ok) {
                    throw new Error(`Failed to load data.`);
                }

                const bioData = await bioResponse.json();
                const projectsData = await projectsResponse.json();
                const blogData = await blogResponse.json();
                
                renderPage(bioData, projectsData.projects || [], blogData.posts || []);
            } catch (error) {
                console.error('Error loading portfolio data:', error);
                document.body.innerHTML = `<div style="text-align:center; padding: 50px; color: var(--red);">Error loading data. See console for details.</div>`;
            }
        }
        
        function setupNavigation() {
            const navLinks = document.querySelectorAll('.nav-link');
            const sections = document.querySelectorAll('.content-section');

            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    const targetId = link.dataset.section;

                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    
                    sections.forEach(s => s.classList.remove('active'));
                    document.getElementById(targetId).classList.add('active');
                });
            });
        }

        function renderPage(bio, projects, blogPosts) {
            document.title = bio.profile.name || 'Portfolio';

            document.getElementById('name').textContent = bio.profile.name;
            document.getElementById('tagline-text').textContent = bio.profile.tagline;
            document.getElementById('bio').textContent = bio.profile.shortBio;
            
            populateSocials(bio.social);
            renderAboutAndExperience(bio.about.fullBio, bio.experience);
            renderProjects(projects);
            renderBlog(blogPosts);
        }

        function renderAboutAndExperience(aboutText, experience) {
            document.getElementById('about-content').textContent = aboutText;

            const experienceContainer = document.getElementById('experience-container');
            experienceContainer.innerHTML = experience.map(exp => `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-date">${exp.date}</div>
                        <div>
                            <h3 class="item-title">${exp.title}</h3>
                            <h4 class="item-subtitle">${exp.company}</h4>
                        </div>
                    </div>
                    <div class="item-description">
                        <ul>
                            ${exp.description.map(d => `<li>${d}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        function renderProjects(projects) {
            const projectsContainer = document.getElementById('projects-container');
            projectsContainer.innerHTML = projects.map(proj => `
                 <div class="item-card">
                    <h3 class="item-title">${proj.title}</h3>
                    <p class="item-description">${proj.description}</p>
                    <div class="tech-tags">
                        ${(proj.technologies || []).map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                    </div>
                    ${ (proj.codeUrl || proj.liveUrl || proj.videoUrl) ? `
                        <div class="item-links">
                            ${proj.codeUrl ? `<a href="${proj.codeUrl}" target="_blank" rel="noopener noreferrer">Code</a>` : ''}
                            ${proj.liveUrl ? `<a href="${proj.liveUrl}" target="_blank" rel="noopener noreferrer">Live</a>` : ''}
                            ${proj.videoUrl ? `<a href="${proj.videoUrl}" target="_blank" rel="noopener noreferrer">Video</a>` : ''}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function renderBlog(posts) {
            const blogContainer = document.getElementById('blog-container');
            blogContainer.innerHTML = posts.map(post => `
                <div class="item-card">
                    <div class="item-date">${post.date}</div>
                    <h3 class="item-title">${post.title}</h3>
                    <p class="item-description">${post.content}</p>
                    <div class="tech-tags">
                         ${(post.tags || []).map(tag => `<span class="tech-tag" style="background-color: var(--blue);">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function populateSocials(socials) {
            const socialIcons = {
                github: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>GitHub</title><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
                linkedin: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>LinkedIn</title><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>`,
                twitter: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Twitter</title><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.223.085c.645 1.956 2.52 3.379 4.734 3.419-1.77 1.377-3.987 2.199-6.396 2.199-.415 0-.825-.023-1.229-.074a13.935 13.935 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>`,
                email: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Email</title><path d="M24 4.5v15c0 .825-.675 1.5-1.5 1.5H1.5C.675 21 0 20.325 0 19.5v-15c0-.414.168-.79.44-1.06C.71 3.17 1.096 3 1.5 3H22.5c.404 0 .79.17 1.06.44.272.27.44.646.44 1.06zM3.937 4.5L12 11.82 20.063 4.5H3.937zM2.25 18h19.5V6.345l-9.458 6.54c-.195.135-.435.21-.692.21s-.497-.075-.692-.21L2.25 6.345V18z"/></svg>`
            };
            const socialContainer = document.getElementById('social-links');
            socialContainer.innerHTML = Object.entries(socials)
                .filter(([_, url]) => url)
                .map(([platform, url]) => `
                    <li>
                        <a href="${platform === 'email' ? 'mailto:' + url : url}" target="_blank" rel="noopener noreferrer" aria-label="${platform}">
                            ${socialIcons[platform] || platform}
                        </a>
                    </li>
                `).join('');
        }
    </script>
</body>
</html>
