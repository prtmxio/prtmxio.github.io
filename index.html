<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pritam | Embedded Systems Engineer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- MathJax configuration: enable $...$ and $$...$$ -->
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] // default safe set
      }
    };
    </script>

    <!-- MathJax loader -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Showdown (Markdown -> HTML) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

    <style>
        /* (omitted for brevity in this snippet) Use your existing styles --
           in the actual file below the full CSS is kept identical to what you provided */
        /* Paste the full CSS from your original file here */
        :root {
            --bg: #0d0d0d;
            --bg-alt: #1a1a1a;
            --fg: #ebdbb2;
            --gray: #c7b9ab;
            --aqua: #689d6a;
            --blue: #458588;
            --green: #98971a;
            --red: #cc241d;
            --yellow: #d79921;
            --card-bg: #282a2b;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; line-height: 1.6; font-size: 16px; }
        body::before {
            content: ''; position: fixed; top:0; left:0; width:100%; height:100%;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(104, 157, 106, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(69, 133, 136, 0.04) 0%, transparent 40%);
            pointer-events:none; z-index:-1;
        }
        .container { max-width:1100px; margin:0 auto; padding:0 40px; display:grid; grid-template-columns:1fr 1fr; gap:4rem; }
        .left-pane { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:96px 0; }
        #profile-pic { width:220px; height:220px; border-radius:25px; margin-bottom:24px; border:5px solid var(--bg-alt); object-fit:cover; transition:transform .3s, border-color .3s; }
        #profile-pic:hover { transform:scale(1.05) rotate(2deg); border-color:var(--aqua); }
        .header-content h1 { font-family:'JetBrains Mono', monospace; font-size:48px; font-weight:700; color:var(--fg); margin-bottom:16px; }
        .header-content h2 { font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:500; color:var(--aqua); margin-bottom:24px; }
        .tagline-cursor::after { content:'▋'; margin-left:8px; opacity:1; animation:blink 1s step-end infinite; }
        @keyframes blink { from,to { opacity:1 } 50% { opacity:0 } }
        .header-content p { color:var(--gray); max-width:400px; }
        .nav-links { list-style:none; margin-top:48px; }
        .nav-links li { margin-bottom:16px; }
        .nav-links a { font-family:'JetBrains Mono', monospace; text-decoration:none; color:var(--gray); font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:0.1em; display:flex; align-items:center; gap:16px; transition:all .2s; cursor:pointer; }
        .nav-links a .nav-indicator { width:30px; height:1px; background-color:var(--gray); transition:all .2s; }
        .nav-text { display:inline-block; width:100px; }
        .nav-links a:hover, .nav-links a.active { color:var(--fg); }
        .nav-links a:hover .nav-indicator, .nav-links a.active .nav-indicator { width:60px; background-color:var(--fg); }
        .resume-container { margin-top:48px; }
        .resume-button { display:inline-block; padding:10px 20px; border:1px solid var(--gray); border-radius:4px; color:var(--gray); font-family:'JetBrains Mono', monospace; text-decoration:none; text-transform:uppercase; font-size:14px; letter-spacing:0.1em; transition:all .2s; }
        .resume-button:hover { background-color:var(--aqua); border-color:var(--aqua); color:var(--bg); }
        .social-links { list-style:none; display:flex; gap:24px; margin-top:auto; padding-top:48px; }
        .social-links a { color:var(--gray); text-decoration:none; transition:color .2s, transform .2s; }
        .social-links a:hover { color:var(--fg); transform:translateY(-2px); }
        .social-links svg { width:24px; height:24px; fill:currentColor; }

        .right-pane { padding:96px 0; }
        .content-section { display:none; animation:fadeIn .5s; }
        .content-section.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
        .about-text { color:var(--gray); margin-bottom:4rem; line-height:1.7; }
        .section-heading { font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; color:var(--fg); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:24px; }
        .item-card { padding:24px; border-radius:8px; margin-bottom:24px; background-color:transparent; border:1px solid var(--bg-alt); transition:background-color .3s, border-color .3s, transform .3s; }
        .item-card:hover { background-color:var(--card-bg); border-color:var(--aqua); transform:translateY(-5px); }
        .item-card .item-header { display:grid; grid-template-columns:1fr 2fr; gap:16px; margin-bottom:8px; }
        .item-date { font-size:13px; color:var(--gray); text-transform:uppercase; padding-top:4px; font-family:'JetBrains Mono', monospace; }
        .item-title { font-size:18px; font-weight:600; color:var(--fg); margin-bottom:4px; }
        .item-title-link { font-size:18px; font-weight:600; color:var(--fg); margin-bottom:4px; text-decoration:none; display:inline-block; transition:color .2s; cursor:pointer; }
        .item-title-link:hover { color:var(--aqua); text-decoration:underline; }
        .item-title-link::after { content:' ↗'; font-family:'Inter', sans-serif; font-size:0.8em; position:relative; top:-2px; opacity:0.6; transition:opacity .2s; }
        .item-title-link:hover::after { opacity:1; }
        .item-subtitle { font-size:16px; color:var(--gray); }
        .item-description, .item-summary { color:var(--gray); margin-bottom:16px; }
        .item-description ul { list-style-position:inside; padding-left:5px; }
        .item-description ul li { margin-bottom:8px; }
        .tech-tags { display:flex; flex-wrap:wrap; gap:8px; }
        .tech-tag { background-color:var(--aqua); color:var(--bg); padding:4px 12px; border-radius:16px; font-size:12px; font-weight:600; font-family:'JetBrains Mono', monospace; }
        .tech-tag.blog-tag { background-color:var(--blue); }

        @media (max-width:992px) {
            .container { display:block; padding:0 24px; }
            .left-pane { position:relative; height:auto; padding:48px 0; }
            .left-pane-bottom { display:flex; flex-direction:column; }
            .right-pane { padding:0 0 48px 0; }
        }
        @media (max-width:768px) {
            .container { padding:0 16px; }
            .item-card .item-header { grid-template-columns:1fr; }
            .item-date { margin-bottom:8px; padding-top:0; }
            #profile-pic { width:120px; height:120px; }
            .header-content h1 { font-size:36px; }
            .header-content h2 { font-size:18px; }
        }

        /* Blog viewer */
        #blog-post-viewer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:var(--bg); z-index:100; overflow-y:auto; animation:fadeIn .3s; }
        .blog-post-container { max-width:1100px; margin:0 auto; padding:96px 40px; }
        .blog-back-button { font-family:'JetBrains Mono', monospace; color:var(--gray); text-decoration:none; font-size:16px; font-weight:600; display:inline-block; margin-bottom:48px; transition:color .2s; }
        .blog-back-button:hover { color:var(--fg); }
        .blog-post-content .post-title { font-family:'JetBrains Mono', monospace; font-size:36px; color:var(--fg); margin-bottom:16px; }
        .blog-post-content .post-date { font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--gray); text-transform:uppercase; margin-bottom:48px; }
        .blog-post-content .post-body { color:var(--gray); font-size:18px; line-height:1.7; }
        .blog-post-content .post-body h2 { font-family:'JetBrains Mono', monospace; font-size:24px; color:var(--fg); margin-top:48px; margin-bottom:16px; }
        .blog-post-content .post-body p { margin-bottom:24px; }
        .blog-post-content .post-body a { color:var(--aqua); text-decoration:underline; }
        .blog-post-content .post-body pre { background-color:var(--card-bg); border:1px solid var(--bg-alt); padding:20px; border-radius:8px; overflow-x:auto; margin-bottom:24px; }
        .blog-post-content .post-body pre code { font-family:'JetBrains Mono', monospace; font-size:14px; background:none; padding:0; border-radius:0; color:inherit; }
        .blog-post-content .post-body p > code, .blog-post-content .post-body li > code { font-family:'JetBrains Mono', monospace; background-color:var(--card-bg); color:var(--fg); padding:2px 6px; border-radius:4px; font-size:0.9em; }
        .blog-post-content .post-body ul, .blog-post-content .post-body ol { padding-left:24px; margin-bottom:24px; }
        .blog-post-content .post-body li { margin-bottom:10px; }
        @media (max-width:768px) { .blog-post-container { padding:48px 24px; } .blog-post-content .post-title { font-size:28px; } }
        /* Blog-only higher-contrast theme (override; paste at end of existing <style>) */
        #blog-post-viewer {
        /* darker background for reading mode */
        background-color: #060608;         /* very dark near-black */
        }

        .blog-post-container {
        /* raise visual contrast of the content area */
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border-radius: 12px;
        padding: 72px 48px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }

        .blog-post-content .post-title,
        .blog-post-content .post-date {
        color: #ffffff;                   /* make title/date bright white */
        }

        /* Main post body: brighter text for comfortable reading */
        .blog-post-content .post-body {
        color: #f7f7f7;                   /* bright off-white for paragraphs */
        font-size: 19px;                  /* slightly larger for readability */
        line-height: 1.85;
        }

        /* Headings inside the blog body */
        .blog-post-content .post-body h1,
        .blog-post-content .post-body h2,
        .blog-post-content .post-body h3 {
        color: #fff;                      /* very bright headings */
        margin-top: 1.1em;
        margin-bottom: .5em;
        }

        /* Links: keep brand accent but more visible */
        .blog-post-content .post-body a {
        color: #8fe1c1;                   /* brighter aqua/green */
        text-decoration: underline;
        }

        /* Code blocks and inline code: higher contrast background */
        .blog-post-content .post-body pre {
        background-color: #111214;        /* darker code bg */
        border: 1px solid rgba(255,255,255,0.04);
        color: #e9f1ef;
        }

        .blog-post-content .post-body code {
        background-color: #0f1112;
        color: #e6f2ef;
        padding: 2px 6px;
        border-radius: 4px;
        }

        /* Lists and blockquotes */
        .blog-post-content .post-body ul,
        .blog-post-content .post-body ol {
        color: #f2f2f2;
        }
        .blog-post-content .post-body blockquote {
        border-left: 3px solid rgba(255,255,255,0.06);
        padding-left: 16px;
        color: #eaeaea;
        background: rgba(255,255,255,0.01);
        margin: 12px 0;
        }

        /* Make the back button more visible on the dark background */
        .blog-back-button {
        color: #dfeee6;
        }

        /* Mobile tweaks */
        @media (max-width: 768px) {
        .blog-post-container { padding: 40px 20px; }
        .blog-post-content .post-body { font-size: 17px; }
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header class="left-pane">
            <div class="header-content">
                <img id="profile-pic" src="res/profile.jpeg" alt="Profile Picture" onerror="this.src='https://placehold.co/220x220/1a1c1d/ebdbb2?text=Pritam';">
                <h1 id="name"></h1>
                <h2 id="tagline"><span id="tagline-text"></span><span class="tagline-cursor"></span></h2>
                <p id="bio"></p>
                <nav>
                    <ul class="nav-links">
                        <li><a data-section="about" class="nav-link active"><span class="nav-indicator"></span><span class="nav-text">About</span></a></li>
                        <li><a data-section="projects" class="nav-link"><span class="nav-indicator"></span><span class="nav-text">Projects</span></a></li>
                        <li><a data-section="blog" class="nav-link"><span class="nav-indicator"></span><span class="nav-text">Blog</span></a></li>
                    </ul>
                </nav>
            </div>

            <div class="left-pane-bottom">
                <div class="resume-container">
                    <a href="res/pritam_resume.pdf" target="_blank" class="resume-button">Download Resume</a>
                </div>
                <ul class="social-links" id="social-links"></ul>
            </div>
        </header>

        <main class="right-pane">
            <section id="about" class="content-section active">
                <div id="about-content" class="about-text"></div>
                <div class="section-heading">Experience</div>
                <div id="experience-container"></div>
            </section>

            <section id="projects" class="content-section">
                <div class="section-heading">Projects</div>
                <div id="projects-container"></div>
            </section>

            <section id="blog" class="content-section">
                <div class="section-heading">Blog</div>
                <div id="blog-container"></div>
            </section>
        </main>
    </div>

    <div id="blog-post-viewer">
        <div class="blog-post-container">
            <a href="#" class="blog-back-button" onclick="hideBlogPost(event)">&larr; Back to Portfolio</a>
            <div class="blog-post-content">
                <h1 id="post-title" class="post-title"></h1>
                <div id="post-date" class="post-date"></div>
                <div id="post-body" class="post-body"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let allBlogPosts = [];

        // Showdown converter
        const markdownConverter = new showdown.Converter();
        markdownConverter.setOption('ghCompatibleHeaderId', true);
        markdownConverter.setOption('simpleLineBreaks', true);

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            setupNavigation();
        });

        async function loadData() {
            try {
                const [bioResponse, projectsResponse, blogResponse] = await Promise.all([
                    fetch('./res/bio.json'),
                    fetch('./res/projects.json'),
                    fetch('./res/blog.json')
                ]);

                if (!bioResponse.ok) throw new Error(`Failed to load bio.json: ${bioResponse.statusText}`);
                if (!projectsResponse.ok) throw new Error(`Failed to load projects.json: ${projectsResponse.statusText}`);
                if (!blogResponse.ok) throw new Error(`Failed to load blog.json: ${blogResponse.statusText}`);

                const bioData = await bioResponse.json();
                const projectsData = await projectsResponse.json();
                const blogRaw = await blogResponse.json();

                // Resolve read_me relative to blog.json location (robust)
                const blogBaseUrl = blogResponse.url;
                const blogPosts = (blogRaw.posts || []).map(p => {
                    try {
                        return { ...p, read_me: new URL(p.read_me, blogBaseUrl).href };
                    } catch (err) {
                        return p;
                    }
                });

                renderPage(bioData, projectsData.projects || [], blogPosts);

            } catch (error) {
                console.error('Error loading portfolio data:', error);
                document.body.innerHTML = `<div style="text-align:center; padding: 50px; color: var(--red); font-family: 'JetBrains Mono', monospace;">
                    <h2>Error loading data</h2>
                    <p>${error.message}</p>
                    <p>Please check the console for details.</p>
                </div>`;
            }
        }

        function setupNavigation() {
            const navLinks = document.querySelectorAll('.nav-link');
            const sections = document.querySelectorAll('.content-section');

            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');

                    sections.forEach(s => s.classList.remove('active'));
                    const targetId = link.dataset.section;
                    document.getElementById(targetId).classList.add('active');

                    if (window.innerWidth <= 992) {
                        document.querySelector('.right-pane').scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        }

        function renderPage(bio, projects, blogPosts) {
            document.title = bio.profile?.name || 'Portfolio';
            document.getElementById('name').textContent = bio.profile?.name || '';
            document.getElementById('tagline-text').textContent = bio.profile?.tagline || '';
            document.getElementById('bio').textContent = bio.profile?.shortBio || '';

            allBlogPosts = blogPosts;

            populateSocials(bio.social);
            renderAboutAndExperience(bio.about?.fullBio || '', bio.experience || []);
            renderProjects(projects);
            renderBlog(blogPosts);
        }

        function renderAboutAndExperience(aboutText, experience) {
            const aboutEl = document.getElementById('about-content');
            aboutEl.textContent = '';
            (aboutText || '').split('\n').forEach(para => {
                if (para.trim()) {
                    const p = document.createElement('p');
                    p.textContent = para;
                    aboutEl.appendChild(p);
                }
            });

            const experienceContainer = document.getElementById('experience-container');
            experienceContainer.innerHTML = (experience || []).map(exp => `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-date">${exp.date}</div>
                        <div>
                            <h3 class="item-title">${exp.title}</h3>
                            <h4 class="item-subtitle">${exp.company}</h4>
                        </div>
                    </div>
                    <div class="item-description">
                        <ul>
                            ${(exp.description || []).map(d => `<li>${d}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        function renderProjects(projects) {
            const projectsContainer = document.getElementById('projects-container');
            projectsContainer.innerHTML = (projects || []).map(proj => {
                const titleHtml = proj.codeUrl
                    ? `<a href="${proj.codeUrl}" target="_blank" rel="noopener noreferrer" class="item-title-link">${proj.title}</a>`
                    : `<h3 class="item-title">${proj.title}</h3>`;
                return `
                 <div class="item-card">
                    ${titleHtml}
                    <p class="item-description">${proj.description || ''}</p>
                    <div class="tech-tags">
                        ${(proj.technologies || []).map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                    </div>
                </div>
            `}).join('');
        }

        function renderBlog(posts) {
            const blogContainer = document.getElementById('blog-container');
            blogContainer.innerHTML = (posts || []).map((post, index) => {
                const titleHtml = `<h3 class="item-title-link" onclick="showBlogPost(${index})">${post.title}</h3>`;
                return `
                <div class="item-card">
                    <div class="item-date">${post.date || ''}</div>
                    ${titleHtml}
                    <p class="item-summary">${post.content || ''}</p>
                    <div class="tech-tags">
                         ${(post.tags || []).map(tag => `<span class="tech-tag blog-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `}).join('');
        }

        // Math-safe blog rendering
        async function showBlogPost(index) {
            const post = allBlogPosts[index];
            if (!post) return;

            document.getElementById('post-title').textContent = post.title || '';
            document.getElementById('post-date').textContent = post.date || '';

            document.getElementById('blog-post-viewer').style.display = 'block';
            document.getElementById('main-container').style.display = 'none';
            window.scrollTo(0, 0);

            const postBody = document.getElementById('post-body');
            postBody.innerHTML = '<p>Loading post...</p>';

            try {
                const response = await fetch(post.read_me);
                if (!response.ok) throw new Error(`File not found: ${post.read_me} (status: ${response.status})`);
                let markdown = await response.text();

                // Extract math blocks before converting markdown
                                // -------------------------
                // Extract math blocks using HTML-comment placeholders (robust across Showdown)
                // -------------------------
                const mathBlocks = [];
                let mathIndex = 0;

                // Helper to push a math block and return a placeholder comment
                function pushMath(tex, display) {
                  const key = `MATH_${mathIndex}`;
                  mathBlocks.push({ key, tex, display });
                  mathIndex++;
                  // return an HTML comment placeholder which Showdown preserves
                  return `<!--${key}-->`;
                }

                // 1) Extract display math $$ ... $$ (multiline allowed)
                // Replace them with HTML comment placeholders
                markdown = markdown.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => pushMath(`$$${tex}$$`, true));

                // 2) Extract inline math $ ... $ (avoid $$)
                // Negative lookbehind/lookahead to ensure we don't match $$...$$
                // This will match single-dollar inline math across the line
                markdown = markdown.replace(/(?<!\$)\$([^\n\$]+?)\$(?!\$)/g, (m, tex) => pushMath(`$${tex}$`, false));

                // Convert markdown to HTML
                let html = markdownConverter.makeHtml(markdown);

                // -------------------------
                // Reinsert math by replacing the HTML comment placeholders
                // -------------------------
                mathBlocks.forEach(m => {
                  // Build a regex that matches the exact comment e.g. <!--MATH_0-->
                  const re = new RegExp(`<!--${m.key}-->`, 'g');

                  if (m.display) {
                    // Put display math on its own lines to be safe
                    html = html.replace(re, `\n\n${m.tex}\n\n`);
                  } else {
                    html = html.replace(re, m.tex);
                  }
                });

                // Decode common HTML entities that Showdown may have introduced
                html = html
                  .replace(/&lt;/g, '<')
                  .replace(/&gt;/g, '>')
                  .replace(/&amp;/g, '&');

                // Insert HTML into page
                postBody.innerHTML = html;


                // Typeset the TeX with MathJax
                if (window.MathJax && MathJax.typesetPromise) {
                    await MathJax.typesetPromise([postBody]);
                } else {
                    // Try again shortly if MathJax hasn't loaded
                    setTimeout(() => {
                        if (window.MathJax && MathJax.typesetPromise) {
                            MathJax.typesetPromise([postBody]).catch(err => console.error('MathJax typeset error:', err));
                        }
                    }, 200);
                }

            } catch (error) {
                console.error('Error loading blog post:', error);
                postBody.innerHTML = `<p style="color: var(--red);">Error: Could not load post content. ${error.message}</p>`;
            }
        }


        
        function hideBlogPost(event) {
            event.preventDefault();
            document.getElementById('blog-post-viewer').style.display = 'none';
            document.getElementById('main-container').style.display = 'grid';
            document.getElementById('post-title').textContent = '';
            document.getElementById('post-date').textContent = '';
            document.getElementById('post-body').innerHTML = '';
        }

        function populateSocials(socials) {
            const socialLinks = socials || {};
            const socialIcons = {
