<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pritam | Embedded Systems Engineer</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [["$", "$"], ["\\(", "\\)"]],
                    displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                },
                options: {
                    skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
                },
            };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

        <style>
            :root {
                --bg: #0a0a0a;
                --bg-alt: #0f0f12;
                --fg: #d8d8d8;
                --muted: #5a5a5a;
                --muted-light: #888;
                --accent: #4af626;
                --blue: #5bc0eb;
                --card-bg: #0e0e11;
                --border: #1e1e22;
            }

            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html { scroll-behavior: smooth; }

            body {
                background-color: var(--bg);
                color: var(--fg);
                font-family: "Inter", sans-serif;
                line-height: 1.6;
                font-size: 15px;
                -webkit-font-smoothing: antialiased;
            }

            /* Layout */
            .container {
                max-width: 1080px;
                margin: 0 auto;
                padding: 0 40px;
                display: grid;
                grid-template-columns: 5fr 7fr;
                gap: 4rem;
            }

            .left-pane {
                position: sticky;
                top: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 80px 0;
            }

            /* Profile */
            #profile-pic {
                width: 140px;
                height: 140px;
                border-radius: 4px;
                margin-bottom: 24px;
                border: 1px solid var(--border);
                object-fit: cover;
                transition: border-color 0.2s;
                display: block;
            }
            #profile-pic:hover {
                border-color: var(--accent);
            }

            /* Header */
            .header-content h1 {
                font-family: "JetBrains Mono", monospace;
                font-size: 28px;
                font-weight: 700;
                color: var(--fg);
                margin-bottom: 6px;
            }
            .header-content h2 {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                font-weight: 400;
                color: var(--accent);
                margin-bottom: 16px;
                letter-spacing: 0.04em;
            }
            .tagline-cursor::after {
                content: "_";
                animation: blink 1s step-end infinite;
            }
            @keyframes blink {
                50% { opacity: 0; }
            }
            .header-content p {
                color: var(--muted-light);
                font-size: 13px;
                max-width: 320px;
                line-height: 1.75;
            }

            /* Nav */
            .nav-links {
                list-style: none;
                margin-top: 36px;
            }
            .nav-links li {
                margin-bottom: 10px;
            }
            .nav-links a {
                font-family: "JetBrains Mono", monospace;
                text-decoration: none;
                color: var(--muted);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: color 0.15s;
                cursor: pointer;
                user-select: none;
            }
            .nav-links a::before {
                content: ">";
                color: var(--accent);
                opacity: 0;
                transition: opacity 0.15s;
                font-weight: 700;
            }
            .nav-links a:hover,
            .nav-links a.active {
                color: var(--fg);
            }
            .nav-links a:hover::before,
            .nav-links a.active::before {
                opacity: 1;
            }

            /* Resume button */
            .resume-container { margin-top: 36px; }
            .resume-button {
                display: inline-block;
                padding: 6px 14px;
                border: 1px solid var(--border);
                color: var(--muted);
                font-family: "JetBrains Mono", monospace;
                text-decoration: none;
                font-size: 11px;
                letter-spacing: 0.1em;
                transition: border-color 0.2s, color 0.2s;
            }
            .resume-button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            /* Social links */
            .social-links {
                list-style: none;
                display: flex;
                gap: 18px;
                margin-top: auto;
                padding-top: 40px;
            }
            .social-links a {
                color: var(--muted);
                text-decoration: none;
                transition: color 0.2s;
            }
            .social-links a:hover { color: var(--fg); }
            .social-links svg {
                width: 17px;
                height: 17px;
                fill: currentColor;
                display: block;
            }

            /* Right pane */
            .right-pane { padding: 80px 0; }

            .content-section {
                display: none;
                animation: fadeIn 0.25s ease;
            }
            .content-section.active { display: block; }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* About text */
            .about-text {
                color: var(--muted-light);
                margin-bottom: 3rem;
                font-size: 14px;
                line-height: 1.8;
            }
            .about-text p + p { margin-top: 1rem; }

            /* Section heading */
            .section-heading {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                font-weight: 700;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.18em;
                margin-bottom: 20px;
            }
            .section-heading::before {
                content: "// ";
                color: var(--accent);
            }

            /* Item cards */
            .item-card {
                padding: 18px 20px;
                margin-bottom: 14px;
                border: 1px solid var(--border);
                transition: border-color 0.2s, background-color 0.2s;
            }
            .item-card:hover {
                border-color: var(--accent);
                background-color: var(--card-bg);
            }

            .item-card .item-header {
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 12px;
                margin-bottom: 8px;
            }

            .item-date {
                font-size: 10px;
                color: var(--muted);
                text-transform: uppercase;
                font-family: "JetBrains Mono", monospace;
                letter-spacing: 0.05em;
                padding-top: 3px;
            }

            .item-title {
                font-size: 14px;
                font-weight: 500;
                color: var(--fg);
                margin-bottom: 2px;
            }

            .item-title-link {
                font-size: 14px;
                font-weight: 500;
                color: var(--fg);
                text-decoration: none;
                transition: color 0.15s;
                cursor: pointer;
                display: inline-block;
                margin-bottom: 6px;
            }
            .item-title-link:hover { color: var(--accent); }
            .item-title-link::after {
                content: " \2197";
                font-size: 0.75em;
                opacity: 0.4;
            }
            .item-title-link:hover::after { opacity: 1; }

            .item-subtitle {
                font-size: 12px;
                color: var(--muted);
            }

            .item-description, .item-summary {
                color: var(--muted-light);
                font-size: 13px;
                margin-top: 8px;
                margin-bottom: 12px;
                line-height: 1.7;
            }

            .item-description ul {
                list-style: none;
                padding: 0;
            }
            .item-description ul li {
                margin-bottom: 5px;
                padding-left: 14px;
                position: relative;
                font-size: 13px;
            }
            .item-description ul li::before {
                content: "-";
                position: absolute;
                left: 0;
                color: var(--accent);
            }

            /* Tech tags */
            .tech-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }
            .tech-tag {
                border: 1px solid var(--border);
                color: var(--muted);
                padding: 1px 7px;
                font-size: 10px;
                font-family: "JetBrains Mono", monospace;
                letter-spacing: 0.04em;
            }
            .tech-tag.blog-tag {
                border-color: rgba(91, 192, 235, 0.3);
                color: var(--blue);
            }

            /* Responsive */
            @media (max-width: 992px) {
                .container {
                    display: block;
                    padding: 0 24px;
                }
                .left-pane {
                    position: relative;
                    height: auto;
                    padding: 48px 0 32px;
                }
                .right-pane { padding: 0 0 48px; }
            }
            @media (max-width: 768px) {
                .container { padding: 0 16px; }
                .item-card .item-header { grid-template-columns: 1fr; }
                .item-date { padding-top: 0; margin-bottom: 4px; }
                #profile-pic { width: 90px; height: 90px; }
                .header-content h1 { font-size: 22px; }
            }

            /* Blog viewer */
            #blog-post-viewer {
                display: none;
                position: fixed;
                inset: 0;
                background-color: var(--bg);
                z-index: 100;
                overflow-y: auto;
                animation: fadeIn 0.25s ease;
            }

            .blog-post-container {
                max-width: 700px;
                margin: 0 auto;
                padding: 72px 40px;
            }

            .blog-back-button {
                font-family: "JetBrains Mono", monospace;
                color: var(--muted);
                text-decoration: none;
                font-size: 11px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                display: inline-block;
                margin-bottom: 48px;
                transition: color 0.2s;
            }
            .blog-back-button:hover { color: var(--fg); }

            .blog-post-content .post-title {
                font-family: "JetBrains Mono", monospace;
                font-size: 26px;
                font-weight: 700;
                color: var(--fg);
                margin-bottom: 10px;
                line-height: 1.3;
            }
            .blog-post-content .post-date {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.12em;
                margin-bottom: 48px;
            }
            .blog-post-content .post-body {
                color: var(--fg);
                font-size: 15px;
                line-height: 1.8;
            }
            .blog-post-content .post-body h1,
            .blog-post-content .post-body h2,
            .blog-post-content .post-body h3 {
                font-family: "JetBrains Mono", monospace;
                color: var(--fg);
                margin-top: 2.5rem;
                margin-bottom: 0.8rem;
            }
            .blog-post-content .post-body h2 { font-size: 18px; }
            .blog-post-content .post-body h3 { font-size: 15px; color: var(--muted-light); }
            .blog-post-content .post-body p { margin-bottom: 1.2rem; }
            .blog-post-content .post-body a {
                color: var(--accent);
                text-decoration: underline;
            }
            .blog-post-content .post-body pre {
                background-color: var(--bg-alt);
                border: 1px solid var(--border);
                padding: 16px;
                overflow-x: auto;
                margin-bottom: 1.2rem;
            }
            .blog-post-content .post-body pre code {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                background: none;
                padding: 0;
                color: inherit;
            }
            .blog-post-content .post-body p > code,
            .blog-post-content .post-body li > code {
                font-family: "JetBrains Mono", monospace;
                background-color: var(--bg-alt);
                color: var(--accent);
                padding: 1px 5px;
                font-size: 0.88em;
            }
            .blog-post-content .post-body ul,
            .blog-post-content .post-body ol {
                padding-left: 20px;
                margin-bottom: 1.2rem;
            }
            .blog-post-content .post-body li { margin-bottom: 6px; }
            .blog-post-content .post-body blockquote {
                border-left: 2px solid var(--accent);
                padding-left: 16px;
                color: var(--muted-light);
                margin: 1rem 0;
            }

            @media (max-width: 768px) {
                .blog-post-container { padding: 48px 20px; }
                .blog-post-content .post-title { font-size: 20px; }
                .blog-post-content .post-body { font-size: 14px; }
            }
        </style>
    </head>
    <body>
        <div class="container" id="main-container">
            <header class="left-pane">
                <div class="header-content">
                    <img
                        id="profile-pic"
                        src="res/prof.jpeg"
                        alt="Pritam"
                        onerror="this.src='https://placehold.co/140x140/0f0f12/d8d8d8?text=P'"
                    />
                    <h1 id="name"></h1>
                    <h2 id="tagline">
                        <span id="tagline-text"></span><span class="tagline-cursor"></span>
                    </h2>
                    <p id="bio"></p>
                    <nav>
                        <ul class="nav-links">
                            <li><a data-section="about" class="nav-link active">about</a></li>
                            <li><a data-section="projects" class="nav-link">projects</a></li>
                            <li><a data-section="blog" class="nav-link">blog</a></li>
                        </ul>
                    </nav>
                </div>

                <div class="left-pane-bottom">
                    <div class="resume-container">
                        <a href="res/pritam_resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-button">resume.pdf</a>
                    </div>
                    <ul class="social-links" id="social-links"></ul>
                </div>
            </header>

            <main class="right-pane">
                <section id="about" class="content-section active">
                    <div id="about-content" class="about-text"></div>
                    <div class="section-heading">Experience</div>
                    <div id="experience-container"></div>
                </section>

                <section id="projects" class="content-section">
                    <div class="section-heading">Projects</div>
                    <div id="projects-container"></div>
                </section>

                <section id="blog" class="content-section">
                    <div class="section-heading">Blog</div>
                    <div id="blog-container"></div>
                </section>
            </main>
        </div>

        <div id="blog-post-viewer">
            <div class="blog-post-container">
                <a href="#" class="blog-back-button" onclick="hideBlogPost(event)">&larr; back</a>
                <div class="blog-post-content">
                    <h1 id="post-title" class="post-title"></h1>
                    <div id="post-date" class="post-date"></div>
                    <div id="post-body" class="post-body"></div>
                </div>
            </div>
        </div>

        <script>
            let allBlogPosts = [];

            const markdownConverter = new showdown.Converter();
            markdownConverter.setOption("ghCompatibleHeaderId", true);
            markdownConverter.setOption("simpleLineBreaks", true);

            document.addEventListener("DOMContentLoaded", () => {
                loadData();
                setupNavigation();
            });

            async function loadData() {
                try {
                    const [bioRes, projRes, blogRes] = await Promise.all([
                        fetch("./res/bio.json"),
                        fetch("./res/projects.json"),
                        fetch("./res/blog.json"),
                    ]);

                    if (!bioRes.ok) throw new Error(`bio.json: ${bioRes.statusText}`);
                    if (!projRes.ok) throw new Error(`projects.json: ${projRes.statusText}`);
                    if (!blogRes.ok) throw new Error(`blog.json: ${blogRes.statusText}`);

                    const [bioData, projectsData, blogRaw] = await Promise.all([
                        bioRes.json(),
                        projRes.json(),
                        blogRes.json(),
                    ]);

                    const blogBaseUrl = blogRes.url;
                    const blogPosts = (blogRaw.posts || []).map((p) => {
                        try {
                            return { ...p, read_me: new URL(p.read_me, blogBaseUrl).href };
                        } catch {
                            return p;
                        }
                    });

                    renderPage(bioData, projectsData.projects || [], blogPosts);
                } catch (err) {
                    console.error("Error loading data:", err);
                    document.body.innerHTML = `
                        <div style="padding:80px 40px;color:#5a5a5a;font-family:'JetBrains Mono',monospace;font-size:13px;">
                            <p style="color:#4af626;margin-bottom:8px;">// error loading data</p>
                            <p>${err.message}</p>
                        </div>`;
                }
            }

            function setupNavigation() {
                const navLinks = document.querySelectorAll(".nav-link");
                const sections = document.querySelectorAll(".content-section");

                navLinks.forEach((link) => {
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        navLinks.forEach((l) => l.classList.remove("active"));
                        sections.forEach((s) => s.classList.remove("active"));

                        link.classList.add("active");
                        document.getElementById(link.dataset.section).classList.add("active");

                        if (window.innerWidth <= 992) {
                            document.querySelector(".right-pane").scrollIntoView({ behavior: "smooth" });
                        }
                    });
                });
            }

            function renderPage(bio, projects, blogPosts) {
                document.title = `${bio.profile?.name || "Portfolio"} | Portfolio`;
                document.getElementById("name").textContent = bio.profile?.name || "";
                document.getElementById("tagline-text").textContent = bio.profile?.tagline || "";
                document.getElementById("bio").textContent = bio.profile?.shortBio || "";

                allBlogPosts = blogPosts;
                populateSocials(bio.social);
                renderAboutAndExperience(bio.about?.fullBio || "", bio.experience || []);
                renderProjects(projects);
                renderBlog(blogPosts);
            }

            function renderAboutAndExperience(aboutText, experience) {
                const aboutEl = document.getElementById("about-content");
                aboutEl.textContent = "";
                (aboutText || "").split("\n").forEach((para) => {
                    if (para.trim()) {
                        const p = document.createElement("p");
                        p.textContent = para;
                        aboutEl.appendChild(p);
                    }
                });

                document.getElementById("experience-container").innerHTML = (experience || [])
                    .map((exp) => `
                        <div class="item-card">
                            <div class="item-header">
                                <div class="item-date">${exp.date}</div>
                                <div>
                                    <h3 class="item-title">${exp.title}</h3>
                                    <p class="item-subtitle">${exp.company}</p>
                                </div>
                            </div>
                            <div class="item-description">
                                <ul>${(exp.description || []).map((d) => `<li>${d}</li>`).join("")}</ul>
                            </div>
                        </div>`)
                    .join("");
            }

            function renderProjects(projects) {
                document.getElementById("projects-container").innerHTML = (projects || [])
                    .map((proj) => {
                        const title = proj.codeUrl
                            ? `<a href="${proj.codeUrl}" target="_blank" rel="noopener noreferrer" class="item-title-link">${proj.title}</a>`
                            : `<h3 class="item-title">${proj.title}</h3>`;
                        return `
                            <div class="item-card">
                                ${title}
                                <p class="item-description">${proj.description || ""}</p>
                                <div class="tech-tags">
                                    ${(proj.technologies || []).map((t) => `<span class="tech-tag">${t}</span>`).join("")}
                                </div>
                            </div>`;
                    })
                    .join("");
            }

            function renderBlog(posts) {
                document.getElementById("blog-container").innerHTML = (posts || [])
                    .map((post, i) => `
                        <div class="item-card">
                            <div class="item-date">${post.date || ""}</div>
                            <h3 class="item-title-link" onclick="showBlogPost(${i})">${post.title}</h3>
                            <p class="item-summary">${post.content || ""}</p>
                            <div class="tech-tags">
                                ${(post.tags || []).map((t) => `<span class="tech-tag blog-tag">${t}</span>`).join("")}
                            </div>
                        </div>`)
                    .join("");
            }

            async function showBlogPost(index) {
                const post = allBlogPosts[index];
                if (!post) return;

                document.getElementById("post-title").textContent = post.title || "";
                document.getElementById("post-date").textContent = post.date || "";
                document.getElementById("blog-post-viewer").style.display = "block";
                document.getElementById("main-container").style.display = "none";
                window.scrollTo(0, 0);

                const postBody = document.getElementById("post-body");
                postBody.innerHTML = "<p>loading...</p>";

                try {
                    const res = await fetch(post.read_me);
                    if (!res.ok) throw new Error(`${post.read_me} (${res.status})`);
                    let md = await res.text();

                    const mathBlocks = [];
                    let mi = 0;

                    function pushMath(tex, display) {
                        const key = `MATH_${mi++}`;
                        mathBlocks.push({ key, tex, display });
                        return `<!--${key}-->`;
                    }

                    md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => pushMath(`$$${tex}$$`, true));
                    md = md.replace(/(?<!\$)\$([^\n$]+?)\$(?!\$)/g, (_, tex) => pushMath(`$${tex}$`, false));

                    let html = markdownConverter.makeHtml(md);

                    mathBlocks.forEach(({ key, tex, display }) => {
                        const re = new RegExp(`<!--${key}-->`, "g");
                        html = html.replace(re, display ? `\n\n${tex}\n\n` : tex);
                    });

                    html = html.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
                    postBody.innerHTML = html;

                    if (window.MathJax?.typesetPromise) {
                        await MathJax.typesetPromise([postBody]);
                    } else {
                        setTimeout(() => {
                            window.MathJax?.typesetPromise?.([postBody])?.catch(console.error);
                        }, 200);
                    }
                } catch (err) {
                    console.error("Blog load error:", err);
                    postBody.innerHTML = `<p style="color:#5a5a5a;font-family:'JetBrains Mono',monospace;font-size:13px;">// error: ${err.message}</p>`;
                }
            }

            function hideBlogPost(event) {
                event.preventDefault();
                document.getElementById("blog-post-viewer").style.display = "none";
                // Clear inline style so CSS media queries handle display correctly
                document.getElementById("main-container").style.display = "";
                document.getElementById("post-title").textContent = "";
                document.getElementById("post-date").textContent = "";
                document.getElementById("post-body").innerHTML = "";
            }

            function populateSocials(socials) {
                const icons = {
                    github: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>GitHub</title><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
