<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pritam | Embedded Systems</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [["$", "$"], ["\\(", "\\)"]],
                    displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                },
                options: {
                    skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
                },
            };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

        <style>
            :root {
                --bg:          #080809;
                --bg-alt:      #0d0d11;
                --bg-card:     #0c0c10;
                --bg-titlebar: #111116;
                --fg:          #e8e8e8;
                --sub:         #b8b8b8;
                --muted:       #888;
                --dim:         #4e4e56;
                --accent:      #4af626;
                --accent-dim:  rgba(74, 246, 38, 0.1);
                --accent-faint:rgba(74, 246, 38, 0.05);
                --blue:        #5bc0eb;
                --blue-dim:    rgba(91, 192, 235, 0.08);
                --border:      #1c1c23;
                --border-2:    #26262f;
                --grad-name:   linear-gradient(135deg, #e8e8e8 0%, #4af626 55%, #5bc0eb 100%);
                --grad-accent: linear-gradient(135deg, #4af626 0%, #5bc0eb 100%);
            }

            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            html, body { height: 100%; }

            body {
                background: #080809;
                background-image:
                    radial-gradient(ellipse at 15% 40%, rgba(74, 246, 38, 0.03) 0%, transparent 55%),
                    radial-gradient(ellipse at 85% 80%, rgba(91, 192, 235, 0.03) 0%, transparent 55%);
                color: var(--fg);
                font-family: "Inter", sans-serif;
                line-height: 1.65;
                font-size: 16px;
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
            }

            /* Scanlines */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(
                    0deg,
                    rgba(0,0,0,0.016) 0px,
                    rgba(0,0,0,0.016) 1px,
                    transparent 1px,
                    transparent 3px
                );
                pointer-events: none;
                z-index: 9998;
            }

            /* ── Boot overlay ─────────────────────────────── */
            #boot-overlay {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: opacity 0.45s ease;
            }
            #boot-lines {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                color: var(--muted);
                line-height: 2;
                min-width: 340px;
            }
            #boot-lines .b-ok { color: var(--accent); }

            /* ── Main grid ────────────────────────────────── */
            #main-container {
                display: grid;
                grid-template-columns: 320px 1fr;
                min-height: 100vh;
                opacity: 0;
                transition: opacity 0.6s ease;
            }

            /* ── Left pane: full-height sticky panel ─────── */
            .left-pane {
                position: sticky;
                top: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
                background: linear-gradient(180deg, #111116 0%, #0d0d11 50%, #0a0a0e 100%);
                border-right: 1px solid var(--border);
                overflow: hidden;
            }
            .left-pane::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 300px;
                background:
                    radial-gradient(ellipse at 30% 120%, rgba(74, 246, 38, 0.08) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 100%, rgba(91, 192, 235, 0.05) 0%, transparent 50%);
                pointer-events: none;
            }

            /* Title bar */
            .terminal-titlebar {
                flex-shrink: 0;
                background: var(--bg-titlebar);
                padding: 10px 16px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid var(--border);
                user-select: none;
            }
            .t-dots { display: flex; gap: 7px; align-items: center; }
            .t-dot  { width: 11px; height: 11px; border-radius: 50%; cursor: default; }
            .t-dot-r { background: #ff5f57; }
            .t-dot-y { background: #febc2e; }
            .t-dot-g { background: #28c840; }
            .t-hostname {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                margin: 0 auto;
                letter-spacing: 0.03em;
            }

            /* Scrollable body area */
            .terminal-body {
                flex: 1;
                overflow-y: auto;
                padding: 22px 20px 16px;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }

            /* Profile pic */
            #profile-pic {
                width: 88px;
                height: 88px;
                border-radius: 14px;
                border: 2px solid transparent;
                background:
                    linear-gradient(var(--bg-alt), var(--bg-alt)) padding-box,
                    var(--grad-accent) border-box;
                object-fit: cover;
                display: block;
                margin-bottom: 22px;
                transition: box-shadow 0.3s, transform 0.3s;
                animation: floatBob 6s ease-in-out infinite, nameIn 0.5s ease both;
            }
            #profile-pic:hover {
                box-shadow:
                    0 0 20px rgba(74, 246, 38, 0.2),
                    0 0 40px rgba(91, 192, 235, 0.1);
                transform: translateY(-4px) scale(1.03);
            }

            /* Prompt rows */
            .p-row {
                display: flex;
                align-items: baseline;
                gap: 8px;
                margin-top: 16px;
                margin-bottom: 4px;
            }
            .p-row:first-of-type { margin-top: 2px; }
            .p-dollar {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                font-weight: 700;
                color: var(--accent);
                flex-shrink: 0;
            }
            .p-cmd {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                letter-spacing: 0.02em;
            }

            /* Outputs */
            #name {
                font-family: "JetBrains Mono", monospace;
                font-size: 30px;
                font-weight: 700;
                padding-left: 2px;
                line-height: 1.15;
                background: var(--grad-name);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                animation: nameIn 0.6s ease both;
            }
            #tagline {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                padding-left: 2px;
                letter-spacing: 0.03em;
                line-height: 1.5;
                background: linear-gradient(90deg, var(--accent) 0%, #7bdb5a 60%, var(--blue) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .t-cursor::after {
                content: "_";
                -webkit-text-fill-color: var(--accent);
                animation: blink 1s step-end infinite;
            }
            #bio {
                font-size: 14px;
                color: var(--sub);
                padding-left: 2px;
                line-height: 1.8;
            }

            /* Nav */
            .nav-links { list-style: none; padding-left: 2px; }
            .nav-links li { margin-bottom: 6px; }
            .nav-links a {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                text-decoration: none;
                color: var(--muted);
                display: inline-flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                transition: color 0.2s, letter-spacing 0.2s;
                letter-spacing: 0.08em;
                user-select: none;
                padding: 2px 0;
            }
            .nav-links a::before {
                content: ">";
                font-weight: 700;
                opacity: 0;
                transform: translateX(-4px);
                transition: opacity 0.2s, transform 0.2s;
                background: var(--grad-accent);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .nav-links a:hover { color: var(--fg); letter-spacing: 0.1em; }
            .nav-links a.active {
                background: var(--grad-accent);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                letter-spacing: 0.1em;
            }
            .nav-links a:hover::before,
            .nav-links a.active::before { opacity: 1; transform: translateX(0); }

            /* ── Social links section ─────────────────────── */
            .terminal-socials {
                flex-shrink: 0;
                border-top: 1px solid var(--border);
                padding: 14px 20px 12px;
                background: var(--bg-titlebar);
            }
            .socials-label {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                color: var(--dim);
                text-transform: uppercase;
                letter-spacing: 0.12em;
                margin-bottom: 10px;
            }
            .social-links {
                list-style: none;
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .social-links li a {
                color: var(--muted);
                text-decoration: none;
                transition: color 0.25s, transform 0.25s, box-shadow 0.25s, background 0.25s;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                border: 1px solid var(--border-2);
                border-radius: 9px;
                background: transparent;
            }
            .social-links li a:hover {
                color: var(--accent);
                border: 1px solid transparent;
                background:
                    linear-gradient(var(--bg-titlebar), var(--bg-titlebar)) padding-box,
                    var(--grad-accent) border-box;
                transform: translateY(-3px);
                box-shadow: 0 6px 16px rgba(74, 246, 38, 0.12), 0 0 0 1px rgba(91,192,235,0.06);
            }
            .social-links svg { width: 17px; height: 17px; fill: currentColor; display: block; }

            /* ── Status bar + resume ──────────────────────── */
            .terminal-statusbar {
                flex-shrink: 0;
                border-top: 1px solid var(--border);
                background: var(--bg-titlebar);
                padding: 10px 20px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .t-status {
                display: flex;
                align-items: center;
                gap: 7px;
            }
            .t-status-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--accent);
                animation: glowPulse 2.5s ease-in-out infinite;
                flex-shrink: 0;
            }
            .t-status-text {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 0.05em;
            }
            .resume-button {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--accent);
                text-decoration: none;
                border: 1px solid transparent;
                padding: 5px 14px;
                border-radius: 5px;
                letter-spacing: 0.06em;
                white-space: nowrap;
                background:
                    linear-gradient(var(--bg-titlebar), var(--bg-titlebar)) padding-box,
                    var(--grad-accent) border-box;
                transition: box-shadow 0.25s, transform 0.25s, color 0.25s;
            }
            .resume-button:hover {
                color: var(--blue);
                box-shadow: 0 0 16px rgba(74, 246, 38, 0.18), 0 0 32px rgba(91, 192, 235, 0.1);
                transform: translateY(-1px);
            }

            /* ── Right pane ───────────────────────────────── */
            .right-pane {
                padding: 56px 52px 80px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                position: relative;
            }
            .right-pane::before {
                content: "";
                position: fixed;
                top: -15%;
                right: -8%;
                width: 600px;
                height: 600px;
                background:
                    radial-gradient(ellipse, rgba(74, 246, 38, 0.03) 0%, transparent 55%),
                    radial-gradient(ellipse at 70% 70%, rgba(91, 192, 235, 0.025) 0%, transparent 55%);
                pointer-events: none;
                z-index: 0;
            }

            .content-section {
                display: none;
                animation: fadeSlideUp 0.35s ease both;
                max-width: 720px;
                width: 100%;
                position: relative;
                z-index: 1;
            }
            .content-section.active { display: block; }

            /* Animations */
            @keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }
            @keyframes blink       { 50% { opacity: 0; } }
            @keyframes pulse       { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
            @keyframes slideIn {
                from { opacity: 0; transform: translateX(-10px); }
                to   { opacity: 1; transform: translateX(0); }
            }
            @keyframes fadeSlideUp {
                from { opacity: 0; transform: translateY(22px); }
                to   { opacity: 1; transform: translateY(0); }
            }
            @keyframes cardIn {
                from { opacity: 0; transform: translateY(16px) scale(0.97); }
                to   { opacity: 1; transform: translateY(0) scale(1); }
            }
            @keyframes floatBob {
                0%, 100% { transform: translateY(0px); }
                50%       { transform: translateY(-6px); }
            }
            @keyframes glowPulse {
                0%, 100% { box-shadow: 0 0 6px rgba(74,246,38,0.7); }
                50%       { box-shadow: 0 0 12px var(--accent), 0 0 24px rgba(74,246,38,0.25), 0 0 40px rgba(91,192,235,0.1); }
            }
            @keyframes nameIn {
                from { opacity: 0; transform: translateY(-8px); filter: blur(4px); }
                to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
            }
            @keyframes gradShift {
                0%   { background-position: 0% 50%; }
                50%  { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
            @keyframes borderGlow {
                0%, 100% { opacity: 0.5; }
                50%       { opacity: 1; }
            }
            @keyframes tagSlideIn {
                from { opacity: 0; transform: translateY(6px) scale(0.92); }
                to   { opacity: 1; transform: translateY(0) scale(1); }
            }

            /* Command headings */
            .cmd-line {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 22px;
                padding-bottom: 13px;
                border-bottom: 1px solid var(--border);
                position: relative;
            }
            .cmd-line::after {
                content: "";
                position: absolute;
                bottom: -1px;
                left: 0;
                width: 80px;
                height: 2px;
                background: linear-gradient(90deg, var(--accent), var(--blue), transparent);
                border-radius: 2px;
            }
            .cmd-dollar {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                font-weight: 700;
                background: var(--grad-accent);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .cmd-text {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                color: var(--muted);
                letter-spacing: 0.03em;
            }
            .section-gap { margin-top: 48px; }

            /* About text */
            .about-text {
                color: var(--sub);
                font-size: 15px;
                line-height: 1.9;
                margin-bottom: 36px;
            }
            .about-text p + p { margin-top: 1.1rem; }

            /* Cards */
            .item-card {
                padding: 20px 22px;
                margin-bottom: 14px;
                border: 1px solid var(--border);
                border-left: 2px solid transparent;
                border-radius: 10px;
                background: linear-gradient(135deg, rgba(13,13,17,0.9) 0%, rgba(10,10,14,0.95) 100%);
                transition: border-color 0.3s, border-left-color 0.3s, background 0.3s, transform 0.3s, box-shadow 0.3s;
                animation: cardIn 0.45s ease both;
                position: relative;
                overflow: hidden;
            }
            .item-card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(135deg, rgba(74,246,38,0) 0%, rgba(91,192,235,0) 100%);
                opacity: 0;
                transition: opacity 0.3s;
                border-radius: inherit;
                pointer-events: none;
            }
            .item-card:hover {
                border-color: rgba(74, 246, 38, 0.2);
                border-left-color: var(--accent);
                background: linear-gradient(135deg, rgba(14,14,18,0.95) 0%, rgba(11,11,16,0.98) 100%);
                transform: translateY(-4px);
                box-shadow:
                    0 12px 32px rgba(0, 0, 0, 0.4),
                    0 0 0 1px rgba(74, 246, 38, 0.08),
                    0 0 20px rgba(74, 246, 38, 0.05);
            }
            .item-card:hover::before {
                opacity: 1;
                background: linear-gradient(135deg, rgba(74,246,38,0.02) 0%, rgba(91,192,235,0.02) 100%);
            }

            .card-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
            }
            .card-idx {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.06em;
                opacity: 0.7;
                background: var(--grad-accent);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .card-date {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .item-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--fg);
                margin-bottom: 4px;
            }
            .item-subtitle {
                font-size: 13px;
                color: var(--sub);
                margin-bottom: 12px;
            }
            .item-title-link {
                font-size: 16px;
                font-weight: 600;
                color: var(--fg);
                text-decoration: none;
                display: inline-block;
                margin-bottom: 10px;
                cursor: pointer;
                transition: color 0.2s;
            }
            .item-title-link:hover {
                background: var(--grad-accent);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .item-title-link::after {
                content: " \2197";
                font-size: 0.72em;
                opacity: 0.35;
                -webkit-text-fill-color: var(--muted);
            }
            .item-title-link:hover::after { opacity: 1; -webkit-text-fill-color: var(--blue); }

            .item-description,
            .item-summary {
                color: var(--sub);
                font-size: 14px;
                line-height: 1.8;
                margin-bottom: 14px;
            }
            .item-description ul { list-style: none; padding: 0; }
            .item-description ul li {
                font-size: 14px;
                color: var(--sub);
                padding-left: 16px;
                position: relative;
                margin-bottom: 6px;
                line-height: 1.7;
            }
            .item-description ul li::before {
                content: "-";
                position: absolute;
                left: 0;
                background: var(--grad-accent);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                font-weight: 700;
            }

            /* Tech tags */
            .tech-tags { display: flex; flex-wrap: wrap; gap: 6px; }
            .tech-tag {
                border: 1px solid var(--border-2);
                color: var(--muted);
                padding: 3px 9px;
                font-size: 11px;
                font-family: "JetBrains Mono", monospace;
                letter-spacing: 0.04em;
                border-radius: 5px;
                transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.2s;
                animation: tagSlideIn 0.35s ease both;
            }
            .item-card:hover .tech-tag {
                border-color: rgba(74, 246, 38, 0.25);
                color: var(--sub);
            }
            .tech-tag:hover {
                border-color: transparent;
                background:
                    linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                    var(--grad-accent) border-box;
                color: var(--fg);
                transform: translateY(-1px);
            }
            .tech-tag.blog-tag {
                border-color: rgba(91, 192, 235, 0.3);
                color: rgba(91, 192, 235, 0.8);
            }

            /* ── Blog viewer ──────────────────────────────── */
            #blog-post-viewer {
                display: none;
                position: fixed;
                inset: 0;
                background: var(--bg);
                background-image:
                    radial-gradient(ellipse at 20% 10%, rgba(74,246,38,0.025) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 90%, rgba(91,192,235,0.02) 0%, transparent 50%);
                z-index: 100;
                overflow-y: auto;
                animation: fadeIn 0.25s ease;
            }
            .blog-post-container {
                max-width: 720px;
                margin: 0 auto;
                padding: 60px 40px 80px;
                position: relative;
            }
            .blog-post-container::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 2px;
                background: var(--grad-accent);
                opacity: 0.6;
                pointer-events: none;
            }
            .blog-back-button {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--accent);
                text-decoration: none;
                letter-spacing: 0.08em;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 40px;
                opacity: 0.8;
                transition: opacity 0.2s;
            }
            .blog-back-button:hover { opacity: 1; }

            .blog-post-content .post-title {
                font-family: "JetBrains Mono", monospace;
                font-size: 22px;
                font-weight: 700;
                background: var(--grad-name);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 8px;
                line-height: 1.3;
            }
            .blog-post-content .post-date {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                margin-bottom: 40px;
            }
            .blog-post-content .post-body {
                color: var(--fg);
                font-size: 15px;
                line-height: 1.85;
            }
            .blog-post-content .post-body h1,
            .blog-post-content .post-body h2,
            .blog-post-content .post-body h3 {
                font-family: "JetBrains Mono", monospace;
                color: var(--fg);
                margin-top: 2.5rem;
                margin-bottom: 0.75rem;
            }
            .blog-post-content .post-body h2 { font-size: 18px; }
            .blog-post-content .post-body h3 { font-size: 14px; color: var(--sub); }
            .blog-post-content .post-body p { margin-bottom: 1.2rem; }
            .blog-post-content .post-body a { color: var(--accent); text-decoration: underline; }
            .blog-post-content .post-body pre {
                background: var(--bg-alt);
                border: 1px solid var(--border-2);
                padding: 14px 16px;
                overflow-x: auto;
                margin-bottom: 1.2rem;
            }
            .blog-post-content .post-body pre code {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                background: none;
                padding: 0;
                color: inherit;
            }
            .blog-post-content .post-body p > code,
            .blog-post-content .post-body li > code {
                font-family: "JetBrains Mono", monospace;
                background: var(--bg-alt);
                color: var(--accent);
                padding: 1px 5px;
                font-size: 0.88em;
            }
            .blog-post-content .post-body ul,
            .blog-post-content .post-body ol {
                padding-left: 22px;
                margin-bottom: 1.2rem;
            }
            .blog-post-content .post-body li { margin-bottom: 6px; }
            .blog-post-content .post-body blockquote {
                border-left: 2px solid var(--accent);
                padding-left: 16px;
                color: var(--sub);
                margin: 1rem 0;
            }

            /* ── Responsive ───────────────────────────────── */
            @media (max-width: 1024px) {
                #main-container { grid-template-columns: 290px 1fr; }
                .right-pane { padding: 44px 36px 60px; }
                .item-title, .item-title-link { font-size: 15px; }
            }
            @media (max-width: 768px) {
                #main-container { display: block; }
                .left-pane {
                    position: relative;
                    height: auto;
                    border-right: none;
                    border-bottom: 1px solid var(--border);
                }
                .left-pane::after { display: none; }
                .terminal-body { max-height: 60vh; }
                .right-pane { padding: 28px 18px 60px; align-items: stretch; }
                .content-section { max-width: 100%; }
                #profile-pic { width: 68px; height: 68px; }
                #name { font-size: 22px; }
                #bio { font-size: 13px; }
                .about-text { font-size: 14px; }
                .item-title, .item-title-link { font-size: 15px; }
                .item-description ul li { font-size: 13px; }
                .blog-post-container { padding: 40px 20px 60px; }
                .blog-post-content .post-title { font-size: 19px; }
                .blog-post-content .post-body { font-size: 14px; }
                .item-card:hover { transform: none; }
                .item-card:hover::before { opacity: 0; }
            }
        </style>
    </head>
    <body>

        <!-- Boot overlay -->
        <div id="boot-overlay">
            <div id="boot-lines"></div>
        </div>

        <div id="main-container">

            <!-- Left: terminal panel -->
            <header class="left-pane">

                <div class="terminal-titlebar">
                    <div class="t-dots">
                        <span class="t-dot t-dot-r"></span>
                        <span class="t-dot t-dot-y"></span>
                        <span class="t-dot t-dot-g"></span>
                    </div>
                    <span class="t-hostname">pritam@portfolio: ~</span>
                </div>

                <div class="terminal-body">
                    <img
                        id="profile-pic"
                        src="res/prof.jpeg"
                        alt="Pritam"
                        onerror="this.src='https://placehold.co/88x88/0e0e12/e4e4e4?text=P'"
                    />

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">whoami</span>
                    </div>
                    <h1 id="name"></h1>

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">./role.sh</span>
                    </div>
                    <div id="tagline">
                        <span id="tagline-text"></span><span class="t-cursor"></span>
                    </div>

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">cat bio.txt</span>
                    </div>
                    <p id="bio"></p>

                    <div class="p-row">
                        <span class="p-dollar">$</span>
                        <span class="p-cmd">ls pages/</span>
                    </div>
                    <nav>
                        <ul class="nav-links">
                            <li><a data-section="about"    class="nav-link active">about</a></li>
                            <li><a data-section="projects" class="nav-link">projects</a></li>
                            <li><a data-section="blog"     class="nav-link">blog</a></li>
                        </ul>
                    </nav>
                </div>

                <!-- Social links (dedicated section) -->
                <div class="terminal-socials">
                    <p class="socials-label">// connect</p>
                    <ul class="social-links" id="social-links"></ul>
                </div>

                <!-- Status bar with resume -->
                <div class="terminal-statusbar">
                    <div class="t-status">
                        <span class="t-status-dot"></span>
                        <span class="t-status-text">online</span>
                    </div>
                    <a href="res/pritam_resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-button">
                        resume.pdf &nearr;
                    </a>
                </div>

            </header>

            <!-- Right: scrollable content -->
            <main class="right-pane">
                <section id="about" class="content-section active">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">cat about.md</span>
                    </div>
                    <div id="about-content" class="about-text"></div>

                    <div class="cmd-line section-gap">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">cat experience.log</span>
                    </div>
                    <div id="experience-container"></div>
                </section>

                <section id="projects" class="content-section">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">ls projects/ --detail</span>
                    </div>
                    <div id="projects-container"></div>
                </section>

                <section id="blog" class="content-section">
                    <div class="cmd-line">
                        <span class="cmd-dollar">$</span>
                        <span class="cmd-text">ls blog/ --sort=date</span>
                    </div>
                    <div id="blog-container"></div>
                </section>
            </main>
        </div>

        <!-- Blog post viewer -->
        <div id="blog-post-viewer">
            <div class="blog-post-container">
                <a href="#" class="blog-back-button" onclick="hideBlogPost(event)">&larr; cd ..</a>
                <div class="blog-post-content">
                    <h1 id="post-title" class="post-title"></h1>
                    <div id="post-date" class="post-date"></div>
                    <div id="post-body" class="post-body"></div>
                </div>
            </div>
        </div>

        <script>
            let allBlogPosts  = [];
            let pendingTagline = null;

            const markdownConverter = new showdown.Converter();
            markdownConverter.setOption("ghCompatibleHeaderId", true);
            markdownConverter.setOption("simpleLineBreaks", true);

            // ── Boot ────────────────────────────────────────
            async function boot() {
                const container = document.getElementById("boot-lines");
                const lines = [
                    `<span class="b-ok">></span> loading prtmxio.github.io...`,
                    `<span class="b-ok">></span> reading profile data...<span class="b-ok"> [OK]</span>`,
                    `<span class="b-ok">></span> mounting filesystem...<span class="b-ok"> [OK]</span>`,
                ];
                for (const line of lines) {
                    await delay(260);
                    const el = document.createElement("div");
                    el.innerHTML = line;
                    container.appendChild(el);
                }
                await delay(360);
                const overlay = document.getElementById("boot-overlay");
                overlay.style.opacity = "0";
                await delay(450);
                overlay.style.display = "none";
                document.getElementById("main-container").style.opacity = "1";
                if (pendingTagline !== null) {
                    setTimeout(() => typeWriter("tagline-text", pendingTagline, 36), 80);
                }
            }

            function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

            function typeWriter(elId, text, speed) {
                const el = document.getElementById(elId);
                if (!el) return;
                el.textContent = "";
                let i = 0;
                const t = setInterval(() => {
                    if (i < text.length) { el.textContent += text[i++]; }
                    else { clearInterval(t); }
                }, speed);
            }

            // ── Init ────────────────────────────────────────
            document.addEventListener("DOMContentLoaded", () => {
                boot();
                loadData();
                setupNavigation();
            });

            // ── Data ────────────────────────────────────────
            async function loadData() {
                try {
                    const [bioRes, projRes, blogRes] = await Promise.all([
                        fetch("./res/bio.json"),
                        fetch("./res/projects.json"),
                        fetch("./res/blog.json"),
                    ]);
                    if (!bioRes.ok)  throw new Error(`bio.json: ${bioRes.statusText}`);
                    if (!projRes.ok) throw new Error(`projects.json: ${projRes.statusText}`);
                    if (!blogRes.ok) throw new Error(`blog.json: ${blogRes.statusText}`);

                    const [bioData, projectsData, blogRaw] = await Promise.all([
                        bioRes.json(), projRes.json(), blogRes.json(),
                    ]);

                    const blogBaseUrl = blogRes.url;
                    const blogPosts = (blogRaw.posts || []).map((p) => {
                        try { return { ...p, read_me: new URL(p.read_me, blogBaseUrl).href }; }
                        catch { return p; }
                    });

                    renderPage(bioData, projectsData.projects || [], blogPosts);
                } catch (err) {
                    console.error("Error loading data:", err);
                    document.getElementById("main-container").innerHTML = `
                        <div style="padding:80px 40px;font-family:'JetBrains Mono',monospace;font-size:12px;">
                            <p style="color:var(--accent);margin-bottom:8px;">// error</p>
                            <p style="color:var(--sub);">${err.message}</p>
                        </div>`;
                }
            }

            // ── Navigation ──────────────────────────────────
            function setupNavigation() {
                const navLinks = document.querySelectorAll(".nav-link");
                const sections = document.querySelectorAll(".content-section");
                navLinks.forEach((link) => {
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        navLinks.forEach((l) => l.classList.remove("active"));
                        sections.forEach((s) => s.classList.remove("active"));
                        link.classList.add("active");
                        const target = document.getElementById(link.dataset.section);
                        target.classList.add("active");
                        // re-trigger CSS animation
                        target.style.animation = "none";
                        target.offsetHeight; // reflow
                        target.style.animation = "";
                        if (window.innerWidth <= 768) {
                            document.querySelector(".right-pane").scrollIntoView({ behavior: "smooth" });
                        }
                    });
                });
            }

            // ── Render ──────────────────────────────────────
            function renderPage(bio, projects, blogPosts) {
                document.title = `${bio.profile?.name || "Portfolio"} | Portfolio`;
                document.getElementById("name").textContent  = bio.profile?.name    || "";
                document.getElementById("bio").textContent   = bio.profile?.shortBio || "";
                pendingTagline = bio.profile?.tagline || "";

                allBlogPosts = blogPosts;
                populateSocials(bio.social);
                renderAboutAndExperience(bio.about?.fullBio || "", bio.experience || []);
                renderProjects(projects);
                renderBlog(blogPosts);
            }

            function renderAboutAndExperience(aboutText, experience) {
                const aboutEl = document.getElementById("about-content");
                aboutEl.textContent = "";
                (aboutText || "").split("\n").forEach((para) => {
                    if (para.trim()) {
                        const p = document.createElement("p");
                        p.textContent = para;
                        aboutEl.appendChild(p);
                    }
                });

                document.getElementById("experience-container").innerHTML = (experience || [])
                    .map((exp, i) => `
                        <div class="item-card" style="animation-delay:${i * 0.07}s">
                            <div class="card-top">
                                <span class="card-idx">[${pad(i + 1)}]</span>
                                <span class="card-date">${exp.date}</span>
                            </div>
                            <h3 class="item-title">${exp.title}</h3>
                            <p class="item-subtitle">${exp.company}</p>
                            <div class="item-description">
                                <ul>${(exp.description || []).map((d) => `<li>${d}</li>`).join("")}</ul>
                            </div>
                        </div>`)
                    .join("");
            }

            function renderProjects(projects) {
                document.getElementById("projects-container").innerHTML = (projects || [])
                    .sort((a, b) => (a.priority || 99) - (b.priority || 99))
                    .map((proj, i) => {
                        const title = proj.codeUrl
                            ? `<a href="${proj.codeUrl}" target="_blank" rel="noopener noreferrer" class="item-title-link">${proj.title}</a>`
                            : `<h3 class="item-title" style="margin-bottom:8px;">${proj.title}</h3>`;
                        return `
                            <div class="item-card" style="animation-delay:${i * 0.07}s">
                                <div class="card-top">
                                    <span class="card-idx">[${pad(i + 1)}]</span>
                                </div>
                                ${title}
                                <p class="item-description">${proj.description || ""}</p>
                                <div class="tech-tags">
                                    ${(proj.technologies || []).map((t) => `<span class="tech-tag">${t}</span>`).join("")}
                                </div>
                            </div>`;
                    })
                    .join("");
            }

            function renderBlog(posts) {
                document.getElementById("blog-container").innerHTML = (posts || [])
                    .map((post, i) => `
                        <div class="item-card" style="animation-delay:${i * 0.07}s">
                            <div class="card-top">
                                <span class="card-idx">[${pad(i + 1)}]</span>
                                <span class="card-date">${post.date || ""}</span>
                            </div>
                            <h3 class="item-title-link" style="cursor:pointer;" onclick="showBlogPost(${i})">${post.title}</h3>
                            <p class="item-summary">${post.content || ""}</p>
                            <div class="tech-tags">
                                ${(post.tags || []).map((t) => `<span class="tech-tag blog-tag">${t}</span>`).join("")}
                            </div>
                        </div>`)
                    .join("");
            }

            function pad(n) { return String(n).padStart(2, "0"); }

            // ── Blog viewer ──────────────────────────────────
            async function showBlogPost(index) {
                const post = allBlogPosts[index];
                if (!post) return;

                document.getElementById("post-title").textContent = post.title || "";
                document.getElementById("post-date").textContent  = post.date  || "";
                document.getElementById("blog-post-viewer").style.display = "block";
                document.getElementById("main-container").style.display   = "none";
                window.scrollTo(0, 0);

                const postBody = document.getElementById("post-body");
                postBody.innerHTML = `<p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);"><span style="color:var(--accent)">></span> loading...</p>`;

                try {
                    const res = await fetch(post.read_me);
                    if (!res.ok) throw new Error(`${post.read_me} (${res.status})`);
                    let md = await res.text();

                    const mathBlocks = [];
                    let mi = 0;
                    function pushMath(tex, display) {
                        const key = `MATH_${mi++}`;
                        mathBlocks.push({ key, tex, display });
                        return `<!--${key}-->`;
                    }

                    md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => pushMath(`$$${tex}$$`, true));
                    md = md.replace(/(?<!\$)\$([^\n$]+?)\$(?!\$)/g, (_, tex) => pushMath(`$${tex}$`, false));

                    let html = markdownConverter.makeHtml(md);
                    mathBlocks.forEach(({ key, tex, display }) => {
                        const re = new RegExp(`<!--${key}-->`, "g");
                        html = html.replace(re, display ? `\n\n${tex}\n\n` : tex);
                    });
                    html = html.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
                    postBody.innerHTML = html;

                    if (window.MathJax?.typesetPromise) {
                        await MathJax.typesetPromise([postBody]);
                    } else {
                        setTimeout(() => window.MathJax?.typesetPromise?.([postBody])?.catch(console.error), 200);
                    }
                } catch (err) {
                    console.error("Blog load error:", err);
                    postBody.innerHTML = `<p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);">// error: ${err.message}</p>`;
                }
            }

            function hideBlogPost(event) {
                event.preventDefault();
                document.getElementById("blog-post-viewer").style.display = "none";
                document.getElementById("main-container").style.display   = "";
                document.getElementById("post-title").textContent = "";
                document.getElementById("post-date").textContent  = "";
                document.getElementById("post-body").innerHTML    = "";
            }

            // ── Socials ──────────────────────────────────────
            function populateSocials(socials) {
                const icons = {
                    github:   `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>GitHub</title><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
                    linkedin: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>LinkedIn</title><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>`,
                    twitter:  `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Twitter</title><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.223.085c.645 1.956 2.52 3.379 4.734 3.419-1.77 1.377-3.987 2.199-6.396 2.199-.415 0-.825-.023-1.229-.074a13.935 13.935 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>`,
                    email:    `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Email</title><path d="M24 4.5v15c0 .825-.675 1.5-1.5 1.5H1.5C.675 21 0 20.325 0 19.5v-15c0-.414.168-.79.44-1.06C.71 3.17 1.096 3 1.5 3H22.5c.404 0 .79.17 1.06.44.272.27.44.646.44 1.06zM3.937 4.5L12 11.82 20.063 4.5H3.937zM2.25 18h19.5V6.345l-9.458 6.54c-.195.135-.435.21-.692.21s-.497-.075-.692-.21L2.25 6.345V18z"/></svg>`,
                };

                document.getElementById("social-links").innerHTML = Object.entries(socials || {})
                    .filter(([, url]) => url)
                    .map(([platform, url]) => `
                        <li>
                            <a href="${platform === "email" ? "mailto:" + url : url}"
                               target="${platform === "email" ? "_self" : "_blank"}"
                               rel="noopener noreferrer"
                               aria-label="${platform}"
                               title="${platform}">
                                ${icons[platform] || platform}
                            </a>
                        </li>`)
                    .join("");
            }
        </script>
    </body>
</html>
